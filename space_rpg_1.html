<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="サルベージャー">
<meta name="theme-color" content="#05060c">
<title>星屑のサルベージャー</title>
<style>
  :root{
    --bg:#05060c;
    --border:#2a3a5c;
    --accent:#4fd6ff;
    --accent2:#ff6b6b;
    --gold:#ffcf5c;
    --text:#dfe8ff;
    --dim:#8a94b8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family:"Hiragino Sans","Yu Gothic",sans-serif; overflow:hidden; user-select:none;
    position:fixed; inset:0; overscroll-behavior:none; -webkit-touch-callout:none;
  }
  #wrap{
    position:relative; width:100vw; height:100vh; height:100dvh; max-width:900px;
    margin:0 auto; background:#000; overflow:hidden; box-shadow:0 0 40px #000;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  canvas{ display:block; width:100%; height:100%; cursor:crosshair; touch-action:none; }
  @media (min-width:601px){
    #wrap{ max-height:640px; margin:auto; top:50%; transform:translateY(-50%); }
  }

  #hud{ position:absolute; top:0; left:0; right:0; padding:8px 10px; display:flex; flex-direction:column; gap:4px; pointer-events:none; font-size:12px; }
  .bar-row{ display:flex; align-items:center; gap:6px; }
  .bar-label{ width:34px; font-size:11px; color:var(--dim); flex-shrink:0;}
  .bar-bg{ flex:1; height:12px; background:#00000080; border:1px solid var(--border); border-radius:6px; overflow:hidden; max-width:220px;}
  .bar-fill{ height:100%; transition:width .15s linear; }
  .fill-shield{ background:linear-gradient(90deg,#2b8fff,#4fd6ff); }
  .fill-hull{ background:linear-gradient(90deg,#ff8b3d,#ffcf5c); }
  .fill-energy{ background:linear-gradient(90deg,#7c4fff,#c98bff); }
  .bar-num{ width:56px; font-size:11px; color:var(--dim); }

  #topRight{ position:absolute; top:8px; right:10px; display:flex; flex-direction:column; align-items:flex-end; gap:4px; font-size:11px; color:var(--dim); }
  #weaponStatus, #hullStatus, #creditsDisplay{ padding:3px 8px; border-radius:6px; border:1px solid var(--border); background:#00000080; }
  #creditsDisplay{ color:var(--gold); border-color:var(--gold); }
  #weaponStatus.broken{ color:var(--accent2); border-color:var(--accent2); animation:blink 1s infinite; }
  @keyframes blink{ 50%{opacity:.4;} }

  #matBar{ position:absolute; top:78px; left:10px; display:flex; gap:8px; pointer-events:none; font-size:11px; color:var(--dim); flex-wrap:wrap; max-width:70%; }
  .matChip{ background:#00000080; border:1px solid var(--border); border-radius:10px; padding:2px 8px; }

  #zoneLabel{ position:absolute; top:8px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--gold); letter-spacing:2px; pointer-events:none; text-shadow:0 0 6px #000; }

  #bottomBtns{ position:absolute; bottom:10px; left:0; right:0; display:flex; justify-content:center; gap:8px; pointer-events:none; }
  .btn{ pointer-events:auto; background:#0d1220dd; border:1px solid var(--accent); color:var(--accent); padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer; }
  .btn:active{ transform:scale(.96); }
  .btn.warn{ border-color:var(--accent2); color:var(--accent2); }
  .btn:disabled{ opacity:.35; pointer-events:none; }

  #toastWrap{ position:absolute; bottom:60px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:2px; pointer-events:none; }
  .toast{ background:#000000aa; padding:2px 10px; border-radius:6px; font-size:11px; color:var(--gold); animation:fadeUp 1.6s forwards; }
  @keyframes fadeUp{ 0%{opacity:1; transform:translateY(0);} 80%{opacity:1;} 100%{opacity:0; transform:translateY(-16px);} }

  /* 母船パネル */
  #panel{ position:absolute; inset:0; background:#05060cf2; display:none; flex-direction:column; padding:14px; overflow-y:auto; z-index:20; }
  #statusOverlay{ position:absolute; inset:0; background:#05060cf5; display:none; flex-direction:column; padding:14px; overflow-y:auto; z-index:22; }
  #statusOverlay.show{ display:flex; }
  #statusOverlay h2{ margin:0 0 10px; color:var(--accent); font-size:16px; letter-spacing:2px; }
  #closeStatus{ position:absolute; top:10px; right:10px; background:none; border:1px solid var(--border); color:var(--dim); border-radius:50%; width:28px; height:28px; cursor:pointer; font-size:14px; }
  .statBlock{ background:#0d1220aa; border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; font-size:12px; line-height:1.7; }
  .statBlock h3{ margin:0 0 4px; color:var(--gold); font-size:12px; letter-spacing:1px; }
  #panel.show{ display:flex; }
  #panel h2{ margin:0 0 10px; color:var(--accent); font-size:16px; letter-spacing:2px; }
  .tabs{ display:flex; gap:6px; margin-bottom:10px; }
  .tab{ flex:1; text-align:center; padding:8px 4px; border:1px solid var(--border); border-radius:8px; font-size:12px; cursor:pointer; color:var(--dim);}
  .tab.active{ color:var(--accent); border-color:var(--accent); background:#0d1220; }
  .tabContent{ display:none; flex-direction:column; gap:8px; }
  .tabContent.active{ display:flex; }
  .card{ background:#0d1220aa; border:1px solid var(--border); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:4px; }
  .card-title{ display:flex; justify-content:space-between; align-items:center; font-size:13px; }
  .card-title .name{ color:var(--text); font-weight:bold; }
  .card-sub{ font-size:11px; color:var(--dim); line-height:1.5; }
  .card-actions{ display:flex; gap:6px; margin-top:4px; }
  .smallbtn{ background:#0d1220; border:1px solid var(--accent); color:var(--accent); border-radius:6px; font-size:11px; padding:5px 10px; cursor:pointer; }
  .smallbtn:disabled{ opacity:.3; pointer-events:none; }
  .smallbtn.equipped{ background:var(--accent); color:#05060c; }
  #closePanel{ position:absolute; top:10px; right:10px; background:none; border:1px solid var(--border); color:var(--dim); border-radius:50%; width:28px; height:28px; cursor:pointer; font-size:14px; }

  #introOverlay{ position:absolute; inset:0; background:#05060c; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; z-index:30; padding:24px; }
  #introOverlay h1{ color:var(--accent); font-size:22px; letter-spacing:4px; margin-bottom:6px; }
  #introOverlay p{ color:var(--dim); font-size:12px; line-height:1.8; max-width:420px; }
  #introButtons{ margin-top:18px; display:flex; gap:10px; }

  /* 戦闘画面 */
  #battleScreen{ position:absolute; inset:0; background:#04050ab0 radial-gradient(ellipse at center, #0c1024 0%, #030308 100%); display:none; flex-direction:column; padding:10px; z-index:25; }
  #battleScreen.show{ display:flex; }
  #victoryOverlay{
    position:absolute; inset:0; z-index:40; display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    background:#03040aee;
  }
  #victoryOverlay.show{ display:flex; }
  #deathOverlay{
    position:absolute; inset:0; z-index:40; display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    background:#0a0304ee;
  }
  #deathOverlay.show{ display:flex; }
  #deathOverlay h2{
    font-size:24px; letter-spacing:6px; margin:0 0 10px; color:var(--accent2);
    text-shadow:0 0 18px #ff6b6b99;
    animation: victoryPop .4s cubic-bezier(.2,1.4,.4,1);
  }
  #deathOverlay p{ color:var(--dim); font-size:12px; margin-bottom:18px; }
  #deathOverlay .btn{ min-width:180px; }
  #victoryOverlay h2{
    font-size:26px; letter-spacing:6px; margin:0 0 14px; color:var(--gold);
    text-shadow:0 0 18px #ffcf5c99;
    animation: victoryPop .4s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes victoryPop{ 0%{ transform:scale(0.4); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  #victoryStats{ display:flex; flex-direction:column; gap:8px; margin-bottom:20px; min-width:240px; }
  .vRow{
    display:flex; justify-content:space-between; background:#0d1220cc; border:1px solid var(--border);
    border-radius:8px; padding:8px 14px; font-size:13px; opacity:0; animation:vFadeIn .35s forwards;
  }
  .vRow .vval{ color:var(--gold); font-weight:bold; }
  @keyframes vFadeIn{ to{ opacity:1; } }
  #enemyRows{ flex:0 0 auto; max-height:34vh; display:flex; flex-direction:row; flex-wrap:wrap; align-content:flex-start; gap:8px; padding:6px 0; overflow-y:auto; }
  .rowLabel{ font-size:9px; color:var(--dim); border:1px solid var(--border); border-radius:4px; padding:0 4px; flex-shrink:0; }
  .enemyCard{ background:#0d1220cc; border:2px solid var(--border); border-radius:10px; padding:8px 10px; min-width:120px; cursor:pointer; position:relative; }
  .enemyCard.selected{ border-color:var(--gold); box-shadow:0 0 10px #ffcf5c66; }
  .enemyCard.dead{ opacity:.25; pointer-events:none; }
  .enemyCard .ename{ font-size:12px; color:var(--text); margin-bottom:4px; display:flex; align-items:center; gap:5px; }
  .etypeicon{ width:14px; height:14px; flex-shrink:0; }
  .etypeicon.drone{ clip-path: circle(50%); }
  .etypeicon.raider{ clip-path: polygon(100% 50%, 20% 0%, 0% 20%, 0% 80%, 20% 100%); }
  .etypeicon.turret{ clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%); }
  .etypeicon.bot{ clip-path: polygon(15% 0%, 85% 0%, 100% 50%, 85% 100%, 15% 100%, 0% 50%); }
  .etypeicon.aa_drone{ clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .enemyCard .ebar-bg{ height:8px; background:#00000090; border-radius:4px; overflow:hidden; border:1px solid var(--border); }
  .enemyCard .ebar-fill{ height:100%; background:linear-gradient(90deg,#ff8080,#ff5c5c); }
  .enemyCard .erange{ font-size:10px; color:var(--dim); margin-top:4px; }

  #battleStage{ width:100%; height:130px; display:block; background:#060814; border:1px solid var(--border); border-radius:8px; margin:6px 0; }

  #battleLog{ height:92px; overflow-y:auto; background:#00000077; border:1px solid var(--border); border-radius:8px; padding:6px 9px; font-size:12px; line-height:1.6; color:var(--dim); margin-bottom:6px; }
  #battleLog div{ padding:2px 0; border-bottom:1px solid #ffffff0f; }
  #battleLog div:last-child{ border-bottom:none; }

  #playerBattleStatus{ display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--dim); margin-bottom:6px; background:#0d1220aa; border:1px solid var(--border); border-radius:8px; padding:8px; }
  #playerBattleStatus .bar-bg{ max-width:none; }
  #weaponSelectRow{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:6px; }
  .wchip{ background:#0d1220; border:1px solid var(--border); color:var(--dim); border-radius:8px; padding:5px 9px; font-size:11px; cursor:pointer; }
  .wchip.equipped{ border-color:var(--gold); color:var(--gold); background:#0d1220; }
  .wchip:active{ transform:scale(.96); }
  #battleCmds{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .cmdBtn{ flex:1; min-width:70px; background:#0d1220; border:1px solid var(--accent); color:var(--accent); border-radius:8px; padding:10px 4px; font-size:12px; cursor:pointer; }
  .cmdBtn:disabled{ opacity:.3; pointer-events:none; }
  .cmdBtn.warn{ border-color:var(--accent2); color:var(--accent2); }
  .cmdBtn.gold{ border-color:var(--gold); color:var(--gold); }
  @media (max-width:600px){
    .btn{ padding:12px 16px; font-size:14px; }
    .cmdBtn{ padding:13px 4px; font-size:13px; min-width:0; }
    .smallbtn{ padding:8px 12px; font-size:12px; }
    .wchip{ padding:8px 11px; font-size:12px; }
    #zoneLabel{ font-size:11px; }
    #hud{ font-size:13px; }
    .bar-label{ width:38px; font-size:12px; }
    #matBar{ font-size:12px; }
    .enemyCard{ min-width:104px; padding:10px 12px; }
    #battleCmds{ gap:8px; }
    #introOverlay h1{ font-size:19px; }
    #introOverlay p{ font-size:13px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="zoneLabel">SPACE SECTOR</div>

  <div id="hud">
    <div class="bar-row">
      <div class="bar-label">SHLD</div>
      <div class="bar-bg"><div id="shieldFill" class="bar-fill fill-shield" style="width:100%"></div></div>
      <div class="bar-num" id="shieldNum">40/40</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">HULL</div>
      <div class="bar-bg"><div id="hullFill" class="bar-fill fill-hull" style="width:100%"></div></div>
      <div class="bar-num" id="hullNum">100/100</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">ENRG</div>
      <div class="bar-bg"><div id="energyFill" class="bar-fill fill-energy" style="width:100%"></div></div>
      <div class="bar-num" id="energyNum">50/50</div>
    </div>
  </div>

  <div id="topRight">
    <div id="creditsDisplay">資金: 0</div>
    <div id="hullStatus">船体: -</div>
    <div id="weaponStatus">武装: -</div>
  </div>
  <div id="matBar"></div>
  <div id="toastWrap"></div>

  <div id="bottomBtns">
    <button class="btn" id="dockBtn" style="display:none;">母船に接続</button>
    <button class="btn" id="enterBtn" style="display:none;">漂流船に突入</button>
    <button class="btn" id="exitBtn" style="display:none;">宙域へ帰還</button>
    <button class="btn" id="statusBtn" style="border-color:var(--dim); color:var(--dim);">ステータス</button>
  </div>

  <div id="statusOverlay">
    <button id="closeStatus">✕</button>
    <h2>艦体ステータス</h2>
    <div id="statusContent"></div>
  </div>

  <div id="panel">
    <button id="closePanel">✕</button>
    <h2>母船ドック</h2>
    <div class="tabs">
      <div class="tab active" data-tab="repair">修理</div>
      <div class="tab" data-tab="equip">装備</div>
      <div class="tab" data-tab="upgrade">強化</div>
      <div class="tab" data-tab="craft">クラフト</div>
      <div class="tab" data-tab="trade">取引</div>
      <div class="tab" data-tab="hull">船体</div>
    </div>
    <div class="tabContent active" id="tab-repair"></div>
    <div class="tabContent" id="tab-equip"></div>
    <div class="tabContent" id="tab-upgrade"></div>
    <div class="tabContent" id="tab-craft"></div>
    <div class="tabContent" id="tab-trade"></div>
    <div class="tabContent" id="tab-hull"></div>
  </div>

  <div id="battleScreen">
    <div id="enemyRows"></div>
    <canvas id="battleStage"></canvas>
    <div id="battleLog"></div>
    <div id="playerBattleStatus"></div>
    <div id="weaponSelectRow"></div>
    <div id="battleCmds">
      <button class="cmdBtn gold" id="cmdAttack">攻撃</button>
      <button class="cmdBtn" id="cmdClose">接近</button>
      <button class="cmdBtn" id="cmdFar">距離を離す</button>
      <button class="cmdBtn" id="cmdGuard">防御</button>
      <button class="cmdBtn warn" id="cmdRepair">応急修理</button>
      <button class="cmdBtn" id="cmdRetreat" style="border-color:var(--dim); color:var(--dim);">撤退する</button>
    </div>
    <div id="victoryOverlay">
      <h2>VICTORY</h2>
      <div id="victoryStats"></div>
      <button class="btn" id="victoryContinueBtn">続ける</button>
    </div>
  </div>

  <div id="deathOverlay">
    <h2>SHIP DOWN</h2>
    <p>船体が限界を迎え、航行不能になった。</p>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <button class="btn" id="deathContinueBtn">母船から再開する</button>
      <button class="btn warn" id="deathNewGameBtn">最初からやり直す</button>
    </div>
  </div>

  <div id="introOverlay">
    <h1>星屑のサルベージャー</h1>
    <p>宇宙船を操縦し、死骸化した漂流船やステーションから素材を回収せよ。<br>
    索敵マーカーに触れると戦闘画面に切り替わる。距離と狙う相手を見極めて戦え。<br>
    後衛は前衛に守られている――まずは前衛を潰すのがセオリーだ。</p>
    <div id="introButtons">
      <button class="btn" id="loadGameBtn" style="display:none;">つづきから</button>
      <button class="btn" id="newGameBtn">はじめから</button>
      <button class="btn" id="testModeBtn" style="border-color:var(--dim); color:var(--dim);">テストモードで開始</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============ 基本セットアップ ============ */
const wrap = document.getElementById('wrap');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W=800,H=500;
function resize(){
  const r = wrap.getBoundingClientRect();
  W = canvas.width = Math.floor(r.width);
  H = canvas.height = Math.floor(r.height);
}
window.addEventListener('resize', resize);

/* ============ サウンド(WebAudio、効果音を簡易合成) ============ */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, duration, type, gainVal, freqEnd){
  try{
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type||'square';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    if(freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime+duration);
    gain.gain.setValueAtTime(gainVal||0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+duration);
  }catch(e){}
}
function sfxFire(kinetic){ kinetic ? beep(220,0.09,'square',0.14,90) : beep(760,0.07,'sine',0.1,320); }
function sfxHit(){ beep(190,0.12,'sawtooth',0.16,70); }
function sfxExplosion(){ beep(140,0.35,'sawtooth',0.22,35); }
function sfxWarn(){ beep(440,0.13,'square',0.15); setTimeout(()=>beep(440,0.13,'square',0.15),150); }
function sfxClick(){ beep(600,0.05,'sine',0.08); }
function sfxEvade(){ beep(900,0.07,'sine',0.09,1300); }
function sfxVictory(){ beep(520,0.12,'sine',0.14,780); setTimeout(()=>beep(780,0.16,'sine',0.14,1040),110); }

/* ============ 戦闘エフェクト(ビーム・ダメージ数値・フラッシュ・爆発・画面シェイク) ============ */
let battleEffects = [];
let shakeTime = 0, shakeMag = 0;
function triggerShake(mag, dur){ shakeTime = dur; shakeMag = Math.max(shakeMag, mag); }
function spawnDamageText(x,y,text,color){
  battleEffects.push({type:'text', x, y, text, color, life:1, maxLife:1, vy:-32});
}
function spawnBeam(x1,y1,x2,y2,color,kinetic){
  battleEffects.push({type:'beam', x1,y1,x2,y2, color, kinetic, life:1, maxLife:1});
  battleEffects.push({type:'muzzle', x:x1, y:y1, color, life:1, maxLife:1});
}
function spawnExplosion(x,y,color){
  const particles = [];
  for(let i=0;i<16;i++){
    const ang = Math.random()*Math.PI*2, spd = 50+Math.random()*100;
    particles.push({x:0,y:0,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd, size:2+Math.random()*2.5, white:Math.random()<0.4});
  }
  battleEffects.push({type:'explosion', x, y, color, life:1, maxLife:1, particles});
  battleEffects.push({type:'shockwave', x, y, color, life:1, maxLife:1});
  triggerShake(6, 0.25);
}
function updateBattleEffects(dt){
  if(shakeTime>0) shakeTime = Math.max(0, shakeTime-dt); else shakeMag = 0;
  battleEffects.forEach(e=>{
    const speedDiv = e.type==='explosion'?0.6 : e.type==='shockwave'?0.4 : e.type==='beam'?0.12 : e.type==='muzzle'?0.1 : 0.9;
    e.life -= dt/speedDiv;
    if(e.type==='text') e.y += e.vy*dt;
    if(e.type==='explosion') e.particles.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; });
  });
  battleEffects = battleEffects.filter(e=>e.life>0);
}
function drawBattleEffects(c){
  battleEffects.forEach(e=>{
    const alpha = Math.max(0, Math.min(1, e.life));
    if(e.type==='text'){
      c.save();
      c.globalAlpha = alpha;
      c.fillStyle = e.color;
      c.font = 'bold 13px sans-serif';
      c.textAlign='center';
      c.fillText(e.text, e.x, e.y);
      c.restore();
    } else if(e.type==='beam'){
      c.save();
      c.globalAlpha = alpha;
      c.strokeStyle = e.color;
      c.lineWidth = e.kinetic ? 2 : 3;
      c.shadowColor = e.color; c.shadowBlur = e.kinetic ? 4 : 10;
      if(e.kinetic){
        // 実弾: 短い破線のトレーサー
        c.setLineDash([6,5]);
      }
      c.beginPath(); c.moveTo(e.x1,e.y1); c.lineTo(e.x2,e.y2); c.stroke();
      c.setLineDash([]);
      c.restore();
    } else if(e.type==='muzzle'){
      c.save();
      c.globalAlpha = alpha;
      c.fillStyle = '#ffffff';
      c.shadowColor = e.color; c.shadowBlur = 12;
      c.beginPath(); c.arc(e.x, e.y, 4*alpha+2, 0, 7); c.fill();
      c.restore();
    } else if(e.type==='shockwave'){
      c.save();
      c.globalAlpha = alpha*0.6;
      c.strokeStyle = e.color||'#ffcf5c';
      c.lineWidth = 2;
      const r = (1-alpha)*26 + 4;
      c.beginPath(); c.arc(e.x, e.y, r, 0, 7); c.stroke();
      c.restore();
    } else if(e.type==='explosion'){
      c.save();
      c.globalAlpha = alpha;
      e.particles.forEach(p=>{
        c.fillStyle = p.white ? '#ffffff' : (e.color||'#ffcf5c');
        c.beginPath(); c.arc(e.x+p.x, e.y+p.y, p.size, 0, 7); c.fill();
      });
      c.restore();
    }
  });
}

  const armor = ARMORS[player.armorId];
  const mod = MODULES[player.moduleId];
  const maxHull = player.maxHull + armor.hullBonus + totalHullUpgradeBonus();
  const hullRatio = maxHull>0 ? Math.max(0, player.hull)/maxHull : 1;
  // シールド発生装置は船体ダメージが蓄積するほど連動して性能が落ちる
  let shieldMult = 1, shieldStageName = '正常';
  if(hullRatio < 0.33){ shieldMult = 0.5; shieldStageName = '重度損傷'; }

    energyRegen: player.energyRegen + mod.regenBonus,

function tryInterceptAttack(attackerName){
  const defenders = player.droneSquadronIds.filter(did=> DRONE_SQUADRONS[did].type==='defense' && droneStrengthOf(did)>0);
  for(const did of defenders){
    const d = DRONE_SQUADRONS[did];
    const chance = d.interceptChance * (droneStrengthOf(did)/100);
    if(Math.random() < chance){
      log(d.name+'が'+attackerName+'の攻撃を迎撃した!', '#8ce89a');
      spawnDamageText(playerScreenPos.x, playerScreenPos.y-16, '迎撃!', '#8ce89a');
      sfxHit();
      rollDroneAttrition(did);
      return true;
    }
  }
  return false;
}
function applyDamageToPlayer(dmg, pierce){
  if(pierce){
    // 実体弾: シールドを無視して船体に直接命中
    player.hull -= dmg;
    return true;
  }
  let remain = dmg;
  if(player.shieldBarrier > 0){
    const absorbed = Math.min(player.shieldBarrier, remain);
    player.shieldBarrier -= absorbed;
    remain -= absorbed;
  }
  let hullHit = false;
  if(remain > 0){
    player.hull -= remain;
    hullHit = true;
  }
  return hullHit;
}

/* ============ ランダムエンカウント(索敵範囲外だと不意打ち) ============ */
let spaceRandomEncounters = [];
let stationRandomEncounters = [];
let randomEncounterTimer = 8 + Math.random()*6;
const RANDOM_ENCOUNTER_CAP = 2;
const RANDOM_POOL = { space:['drone','raider'], station:['bot','turret'] };
function spawnRandomEncounter(){
  const list = zone==='space' ? spaceRandomEncounters : stationRandomEncounters;
  if(list.length >= RANDOM_ENCOUNTER_CAP) return;
  const pool = RANDOM_POOL[zone];
  const enemyCount = Math.random()<0.35 ? 2 : 1;
  const enemies = [];
  for(let i=0;i<enemyCount;i++){
    const type = pool[Math.floor(Math.random()*pool.length)];
    enemies.push({type, row: i===0?'front':'back'});
  }
  let ex, ey, tries=0;
  do{
    ex = 40 + Math.random()*(W-80);
    ey = 40 + Math.random()*(H-80);
    tries++;
  } while(dist({x:ex,y:ey}, player) < 180 && tries<10);
  list.push({id:'rand'+Date.now()+Math.random(), x:ex, y:ey, cleared:false, isRandom:true, everSeen:false, enemies});
}
function updateRandomEncounters(dt){
  randomEncounterTimer -= dt;
  if(randomEncounterTimer <= 0){
    randomEncounterTimer = 8 + Math.random()*6;
    if(Math.random() < 0.6) spawnRandomEncounter();
  }
  const st = currentStats();
  const list = zone==='space' ? spaceRandomEncounters : stationRandomEncounters;
  list.forEach(enc=>{
    if(!enc.everSeen && dist(player, enc) <= st.sensorRadius) enc.everSeen = true;
  });
}

function getPos(e){
  const r = canvas.getBoundingClientRect();
  const cx = (e.touches? e.touches[0].clientX : e.clientX) - r.left;
  const cy = (e.touches? e.touches[0].clientY : e.clientY) - r.top;
  return {x: cx * (W/r.width), y: cy * (H/r.height)};
}
canvas.addEventListener('mousedown', onClick);
canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); onClick(e); }, {passive:false});
function onClick(e){
  if(panelOpen || inBattle) return;
  const p = getPos(e);
  player.tx = Math.max(14, Math.min(W-14, p.x));
  player.ty = Math.max(14, Math.min(H-14, p.y));
  if(zone==='station'){
    for(const n of salvageNodes){
      if(!n.collected && dist(p,n) < n.r+10){
        player.tx = n.x; player.ty = n.y;
        n.pendingCollect = true;
      }
    }
  }
}

function repairCost(){
  const st = currentStats();
  const hullMissingRatio = Math.max(0, 1 - player.hull/st.maxHull);
  const weaponDamageSum = player.ownedWeapons.reduce((s,wid)=> s+(player.weaponStages[wid]||0), 0);
  const droneMissing = player.droneSquadronIds.reduce((s,did)=> s + Math.max(0,(100-droneStrengthOf(did)))/100, 0);
  return Math.round(15 + hullMissingRatio*50 + weaponDamageSum*10 + droneMissing*15);
}

function renderHull(){

    c.className='card';

    if(active){ btnLabel='使用中'; btnDisabled=true; }
    else if(owned){ btnLabel='乗り換える'; btnDisabled=false; }
    else { btnLabel='購入する('+h.cost+'クレジット)'; btnDisabled=!afford; }

      <div class="card-sub">${h.desc}<br>武装スロット: <b>${h.weaponSlots}</b> / 艦載機スロット: <b>${h.droneSlots}</b>${h.cost>0?' / 価格: '+h.cost+'クレジット':' / 初期所持'}</div>
      <div class="card-actions"><button class="smallbtn ${active?'equipped':''}" ${btnDisabled?'disabled':''}>${btnLabel}</button></div>`;
    c.querySelector('button').onclick = ()=>{

        if(player.credits < h.cost) return;
        player.credits -= h.cost;
        player.ownedShipHulls.push(h.id);
        toast(h.name+'を購入した', '#ffcf5c');
      }
      const newSlots = h.weaponSlots;
      if(player.equippedWeapons.length > newSlots){
        // スロットが減る場合は超過分を自動で外す
        const removed = player.equippedWeapons.splice(newSlots);
        toast(removed.length+'門を装備から外した(スロット不足)', '#ff9f4d');
      }
      if(player.droneSquadronIds.length > (h.droneSlots||1)){

      player.shipHullId = h.id;
      toast(h.name+'に乗り換えた', '#4fd6ff');
      renderHull(); renderEquip(); updateHud(); saveGame();
    };
    wrapH.appendChild(c);

/* ============ マップ移動ループ ============ */
let lastT = performance.now();
let stars = [];
function initStars(){
  stars=[];
  for(let i=0;i<120;i++) stars.push({x:Math.random()*2000, y:Math.random()*2000, r:Math.random()*1.6+0.3, tw:Math.random()*Math.PI*2});
}
initStars();

function moveToward(obj, speed, dt){
  const dx = obj.tx-obj.x, dy = obj.ty-obj.y;
  const d = Math.hypot(dx,dy);
  if(d<2) return;
  const step = Math.min(d, speed*dt);
  obj.x += dx/d*step;
  obj.y += dy/d*step;
  if(dx!==0) player.facing = dx>0?1:-1;
}
function respawnAtBase(){
  const st = currentStats();
  zone='space';
  player.x=player.tx=player.lastDockPos.x; player.y=player.ty=player.lastDockPos.y;
  player.hull = Math.max(1, Math.floor(st.maxHull*0.3));
  player.shieldBarrier = st.maxShieldBarrier;
  player.ownedWeapons.forEach(wid=>{ player.weaponStages[wid] = 0; });
  zoneLabel.textContent='SPACE SECTOR';
  toast('船体大破 ―― 緊急脱出、母船付近まで帰還した','#ff6b6b');
  saveGame();
}

function frame(t){
  const dt = Math.min(0.05, (t-lastT)/1000);
  lastT = t;
  const st = currentStats();

  if(!inBattle && !panelOpen){
    moveToward(player, player.baseSpeed, dt);
    player.energy = Math.min(st.maxEnergy, player.energy + st.energyRegen*dt);
    player.shieldBarrier = Math.min(st.maxShieldBarrier, player.shieldBarrier + st.shieldRegen*dt);
    player.weaponRegenTimer += dt;
    if(player.weaponRegenTimer >= 25){
      player.weaponRegenTimer = 0;
      let anyRegen = false;
      player.ownedWeapons.forEach(wid=>{
        const stage = player.weaponStages[wid]||0;
        if(stage > 1){ player.weaponStages[wid] = stage-1; anyRegen = true; }
      });
      if(anyRegen) toast('整備クルーが武装を応急処置した(完全回復は母船で)', '#4fd6ff');
    }

    updateRandomEncounters(dt);

    const encounters = zone==='space'? SPACE_ENCOUNTERS: STATION_ENCOUNTERS;
    let triggered = false;
    const now = performance.now();
    for(const enc of encounters){
      if(!enc.cleared && dist(player, enc) < 30 && !(enc.retreatCooldownUntil && now < enc.retreatCooldownUntil)){
        startBattle(enc);
        triggered = true;
        break;
      }
    }
    if(!triggered){
      const randList = zone==='space'? spaceRandomEncounters: stationRandomEncounters;
      for(const enc of randList){
        if(dist(player, enc) < 26 && !(enc.retreatCooldownUntil && now < enc.retreatCooldownUntil)){
          startBattle(enc);
          break;
        }
      }
    }
    if(zone==='station'){
      salvageNodes.forEach(n=>{
        if(!n.collected && n.pendingCollect && dist(player,n)<n.r+12){
          n.collected = true;
          const matKeys = Object.keys(MAT_NAMES);
          const m = matKeys[Math.floor(Math.random()*matKeys.length)];
          const n2 = Math.floor(Math.random()*2)+1;
          player.materials[m]+=n2;
          toast('回収: +'+n2+' '+MAT_NAMES[m], '#ffcf5c');
          updateMatBar(); saveGame();
        }
      });
    }
  }

  render();
  updateButtons();
  updateHud();
  requestAnimationFrame(frame);
}
function updateButtons(){
  if(panelOpen || inBattle){ dockBtn.style.display='none'; enterBtn.style.display='none'; exitBtn.style.display='none'; return; }
  if(zone==='space'){
    dockBtn.style.display = dist(player, spaceObjs.dock) < 60 ? 'inline-block':'none';
    enterBtn.style.display = dist(player, spaceObjs.stationGate) < 60 ? 'inline-block':'none';
    exitBtn.style.display='none';
  } else {
    dockBtn.style.display='none'; enterBtn.style.display='none';
    exitBtn.style.display = dist(player, stationExit) < 60 ? 'inline-block':'none';
  }
}

/* ============ マップ描画 ============ */
function drawShip(x,y,color,facing,broken){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(facing||1,1);
  ctx.beginPath();
  ctx.moveTo(12,0); ctx.lineTo(-10,-8); ctx.lineTo(-5,0); ctx.lineTo(-10,8);
  ctx.closePath();
  ctx.fillStyle = broken? '#555' : color;
  ctx.fill();
  ctx.strokeStyle='#ffffff55'; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
}
function drawStationIcon(x,y,color,label){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(x,y,16,0,7); ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y,22,0,7); ctx.globalAlpha=0.4; ctx.stroke();
  ctx.globalAlpha=1;
  ctx.fillStyle=color; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText(label, x, y+34);
  ctx.restore();
}
function drawEncounterMarker(enc, isSensor){
  if(enc.cleared) return;
  const t = performance.now()/300;
  ctx.save();
  ctx.translate(enc.x, enc.y);
  ctx.rotate(Math.sin(t)*0.15);
  ctx.fillStyle= isSensor ? '#ffcf5c' : '#ff6b6b';
  ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(12,10); ctx.lineTo(-12,10); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#05060c';
  ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
  ctx.fillText(isSensor?'?':'!', 0, 6);
  ctx.restore();
  // 編成艦種を示す色ドット
  const n = enc.enemies.length;
  const dotStartX = enc.x - (n-1)*6;
  enc.enemies.forEach((e,i)=>{
    ctx.fillStyle = ENEMY_DEFS[e.type].color;
    ctx.beginPath(); ctx.arc(dotStartX + i*12, enc.y+22, 4, 0, 7); ctx.fill();
  });
}
function render(){
  ctx.clearRect(0,0,W,H);
  const st = currentStats();
  if(zone==='space'){
    ctx.fillStyle='#05060c'; ctx.fillRect(0,0,W,H);
    stars.forEach(s=>{
      const sx = s.x % W, sy = s.y % H;
      const tw = 0.5+0.5*Math.sin(performance.now()/600 + s.tw);
      ctx.fillStyle = `rgba(200,220,255,${0.3+0.5*tw})`;
      ctx.beginPath(); ctx.arc(sx,sy,s.r,0,7); ctx.fill();
    });
    drawStationIcon(spaceObjs.dock.x, spaceObjs.dock.y, '#4fd6ff', '母船');
    drawStationIcon(spaceObjs.stationGate.x, spaceObjs.stationGate.y, '#ffcf5c', '漂流船');
    SPACE_ENCOUNTERS.forEach(drawEncounterMarker);
    spaceRandomEncounters.forEach(enc=>{ if(dist(player,enc)<=st.sensorRadius) drawEncounterMarker(enc, true); });
  } else {
    ctx.fillStyle='#0a0a10'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#1a2440'; ctx.lineWidth=1;
    for(let gx=0; gx<W; gx+=40){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
    for(let gy=0; gy<H; gy+=40){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }
    drawStationIcon(stationExit.x, stationExit.y, '#4fd6ff', '出口');
    salvageNodes.forEach(n=>{
      if(n.collected) return;
      ctx.save(); ctx.translate(n.x,n.y); ctx.rotate(Math.PI/4);
      ctx.fillStyle='#ffcf5c'; ctx.fillRect(-8,-8,16,16); ctx.restore();
    });
    STATION_ENCOUNTERS.forEach(drawEncounterMarker);
    stationRandomEncounters.forEach(enc=>{ if(dist(player,enc)<=st.sensorRadius) drawEncounterMarker(enc, true); });
  }
  // 索敵範囲の輪
  ctx.save();
  ctx.strokeStyle='#4fd6ff2a'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(player.x, player.y, st.sensorRadius, 0, 7); ctx.stroke();
  ctx.restore();
  drawShip(player.x, player.y, '#4fd6ff', player.facing, player.equippedWeapons.every(wid=>(player.weaponStages[wid]||0)>=3));
  if(Math.hypot(player.tx-player.x, player.ty-player.y) > 3){
    ctx.strokeStyle='#4fd6ff66';
    ctx.beginPath(); ctx.arc(player.tx, player.ty, 6, 0, 7); ctx.stroke();
  }
}

function drawShipIcon(c, x, y, color, facing, dead, selected, flash){
  c.save();
  c.translate(x,y);
  c.scale(facing,1);
  if(selected){
    c.save(); c.scale(1/facing,1);
    c.strokeStyle='#ffcf5c'; c.lineWidth=2;
    c.beginPath(); c.arc(0,0,20,0,7); c.stroke();
    c.restore();
  }
  c.beginPath();
  c.moveTo(14,0); c.lineTo(-11,-9); c.lineTo(-5,0); c.lineTo(-11,9);
  c.closePath();
  c.fillStyle = dead? '#333' : (flash>0 ? '#ffffff' : color);
  c.fill();
  c.strokeStyle = dead? '#555' : '#ffffff66';
  c.lineWidth=1; c.stroke();
  c.restore();
}
function drawRadarDish(c, r){
  c.save();
  // 外周のディッシュ(固定)
  c.beginPath(); c.arc(0,0,r,0,7); c.fill(); c.stroke();
  c.beginPath(); c.arc(0,0,r*0.4,0,7); c.globalAlpha=0.6; c.fill(); c.globalAlpha=1;
  // 回転するスキャンライン
  c.rotate(performance.now()/450);
  c.strokeStyle='#ffffffcc'; c.lineWidth=1.4;
  c.beginPath(); c.moveTo(0,0); c.lineTo(r*1.6,0); c.stroke();
  c.beginPath(); c.moveTo(0,0); c.lineTo(-r*1.6*0.3,0.1); c.stroke();
  c.restore();
}
function drawDroneShape(c, squadronType){
  // 艦種ごとのシルエット。敵の防空ドローンと同じ描画関数を使い、見た目を統一する
  if(squadronType==='aa1'){
    drawRadarDish(c, 4.5);
  } else if(squadronType==='scout1'){
    // 索敵ドローン: 小さな丸+側翼
    c.beginPath(); c.arc(0,0,3.2,0,7); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-2,-1.5); c.lineTo(-7,-3.5); c.lineTo(-3,0.4); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-2,1.5); c.lineTo(-7,3.5); c.lineTo(-3,-0.4); c.closePath(); c.fill(); c.stroke();
  } else if(squadronType==='bomber1'){
    // 爆撃機: どっしりした台形ボディ
    c.beginPath(); c.moveTo(6,0); c.lineTo(1,-4); c.lineTo(-5,-3); c.lineTo(-5,3); c.lineTo(1,4); c.closePath(); c.fill(); c.stroke();
  } else {
    // 戦闘機(既定・fighter1): 細い矢型
    c.beginPath(); c.moveTo(5,0); c.lineTo(-3,-3); c.lineTo(-3,3); c.closePath(); c.fill(); c.stroke();
  }
}
function drawDroneWing(c, baseX, baseY, sign, orbit, row, squadronId, slotIdx){
  const strength = squadronId ? droneStrengthOf(squadronId) : 100;
  const wingCount = strength<=0 ? 0 : strength>66 ? 3 : strength>33 ? 2 : 1;
  const wingColor = strength<=0 ? '#555' : (strength<=30 ? '#ff9f4d' : '#8ce89a');
  const squadronType = squadronId || 'fighter1';
  const slotOffset = (slotIdx||0) * 8; // 複数艦種が同じ場所を周回する際に軌道をずらす
  const t = performance.now()/1000;
  for(let i=0;i<wingCount;i++){
    let wx, wy, angle;
    if(orbit){
      const orbitR = 20 + slotOffset + (i%2)*6;
      const speed = 1.1 + i*0.15;
      const phase = t*speed + i*(Math.PI*2/3) + slotOffset*0.1;
      wx = baseX + Math.cos(phase)*orbitR;
      wy = baseY + Math.sin(phase)*orbitR*0.55; // 楕円軌道(奥行き感)
      angle = phase + Math.PI/2;
    } else if(row){
      // 複数の敵編隊全体の上を横一列に飛行(左右にゆっくり往復)
      const spacing = 16;
      const spanOffset = (i - (wingCount-1)/2) * spacing;
      const sway = Math.sin(t*0.9 + i*1.3)*10;
      wx = baseX + spanOffset + sway;
      wy = baseY + Math.sin(t*2.4 + i)*3;
      angle = Math.sin(t*0.9 + i*1.3) > 0 ? -Math.PI/2 - 0.3 : -Math.PI/2 + 0.3;
    } else {
      wx = baseX + sign*(i*9);
      wy = baseY - (i%2)*6 + Math.sin(t*3.8 + i)*2;
      angle = sign<0 ? Math.PI : 0;
    }
    c.save();
    c.translate(wx, wy);
    c.rotate(angle);
    c.fillStyle = wingColor;
    c.strokeStyle = '#ffffff55'; c.lineWidth = 0.6;
    drawDroneShape(c, squadronType);
    c.restore();
  }
  if(wingCount===0){
    c.fillStyle='#ff6b6b'; c.font='9px sans-serif'; c.textAlign='center';
    c.fillText('艦載機壊滅', baseX+sign*8, baseY);
  }
}
function drawEnemyIcon(c, x, y, type, color, facing, dead, selected, flash){
  if(selected){
    c.save();
    c.strokeStyle='#ffcf5c'; c.lineWidth=2;
    c.beginPath(); c.arc(x,y,20,0,7); c.stroke();
    c.restore();
  }
  c.save();
  c.translate(x,y);
  c.scale(facing,1);
  c.fillStyle = dead? '#333' : (flash>0 ? '#ffffff' : color);
  c.strokeStyle = dead? '#555' : '#ffffff66';
  c.lineWidth=1;
  if(type==='drone'){
    // 丸い本体+小さな側翼(索敵ドローン)
    c.beginPath(); c.arc(0,0,8,0,7); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-6,-4); c.lineTo(-16,-9); c.lineTo(-7,1); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-6,4); c.lineTo(-16,9); c.lineTo(-7,-1); c.closePath(); c.fill(); c.stroke();
  } else if(type==='raider'){
    // 細長いダート型(高機動レイダー)
    c.beginPath();
    c.moveTo(17,0); c.lineTo(-4,-6); c.lineTo(-15,-4); c.lineTo(-15,4); c.lineTo(-4,6);
    c.closePath(); c.fill(); c.stroke();
  } else if(type==='turret'){
    // 六角形の固定砲台+砲身(移動しない防衛ユニット)
    c.beginPath();
    c.moveTo(-9,-11); c.lineTo(9,-11); c.lineTo(15,0); c.lineTo(9,11); c.lineTo(-9,11); c.lineTo(-15,0);
    c.closePath(); c.fill(); c.stroke();
    c.fillRect(-2,-2,17,4);
  } else if(type==='bot'){
    // 小型ボディ+アーム状の突起(整備ボット)
    c.beginPath(); c.moveTo(11,0); c.lineTo(-6,-9); c.lineTo(-1,0); c.lineTo(-6,9); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-6,-9); c.lineTo(-15,-12); c.stroke();
    c.beginPath(); c.moveTo(-6,9); c.lineTo(-15,12); c.stroke();
  } else if(type==='aa_drone'){
    // 星型(防空ドローン、迎撃特化のシルエット)。常時回転してレーダー稼働中を演出
    if(!dead){
      c.save();
      c.strokeStyle = color; c.globalAlpha = 0.35; c.lineWidth = 1;
      c.beginPath(); c.arc(0,0,13,0,7); c.stroke();
      c.restore();
    }
    drawRadarDish(c, 7);
  } else {
    c.beginPath(); c.moveTo(14,0); c.lineTo(-11,-9); c.lineTo(-5,0); c.lineTo(-11,9); c.closePath(); c.fill(); c.stroke();
  }
  c.restore();
}
function drawBattleStage(){
  if(!battle) return;
  const c = battleStageCtx;
  const W2 = battleStageCanvas.width, H2 = battleStageCanvas.height;
  c.clearRect(0,0,W2,H2);

  // 背景: 星+ネビュラのグラデーション
  const t = performance.now()/1000;
  const grad = c.createRadialGradient(W2*0.5,H2*0.5,0, W2*0.5,H2*0.5, Math.max(W2,H2)*0.7);
  grad.addColorStop(0, '#101836');
  grad.addColorStop(1, '#03040a');
  c.fillStyle = grad;
  c.fillRect(0,0,W2,H2);
  if(!battleStars.length || battleStars[0].w!==W2){
    battleStars = [];
    for(let i=0;i<40;i++) battleStars.push({x:Math.random()*W2, y:Math.random()*H2, r:Math.random()*1.3+0.3, tw:Math.random()*Math.PI*2, w:W2});
  }
  battleStars.forEach(s=>{
    const tw = 0.4+0.6*Math.sin(t*2+s.tw);
    c.fillStyle = `rgba(200,220,255,${0.2+0.4*tw})`;
    c.beginPath(); c.arc(s.x, s.y, s.r, 0, 7); c.fill();
  });

  // 画面シェイク
  c.save();
  if(shakeTime>0){
    const sx = (Math.random()*2-1)*shakeMag*(shakeTime);
    const sy = (Math.random()*2-1)*shakeMag*(shakeTime);
    c.translate(sx, sy);
  }

  // 距離ゾーン背景 (近距離/中距離/遠距離) + スキャンライン
  const curZone = zoneOf(battle.distance);
  const zoneX0 = 70, zoneW = (W2-90)/3;
  for(let i=0;i<3;i++){
    const zx = zoneX0 + i*zoneW;
    c.fillStyle = i===curZone ? '#4fd6ff22' : '#ffffff06';
    c.fillRect(zx, 0, zoneW-4, H2);
    if(i===curZone){
      c.strokeStyle='#4fd6ff88'; c.lineWidth=1; c.strokeRect(zx,0,zoneW-4,H2);
      const scanY = ((t*40)%H2);
      const scanGrad = c.createLinearGradient(0,scanY-10,0,scanY+10);
      scanGrad.addColorStop(0,'#4fd6ff00'); scanGrad.addColorStop(0.5,'#4fd6ff33'); scanGrad.addColorStop(1,'#4fd6ff00');
      c.fillStyle = scanGrad;
      c.fillRect(zx, scanY-10, zoneW-4, 20);
    }
    c.fillStyle = i===curZone ? '#ffcf5c' : '#5a6690';
    c.font='10px sans-serif'; c.textAlign='center';
    c.fillText(BAND_NAMES[i], zx+zoneW/2-2, H2-6);
  }

  // 細かい距離ゲージ(0-8の目盛り、現在位置を明示)
  const trackW0 = zoneW*3 - 24;
  const trackX0 = zoneX0+12, trackX1 = trackX0+trackW0;
  const gaugeY = 10;
  c.strokeStyle = '#ffffff2a'; c.lineWidth=1;
  c.beginPath(); c.moveTo(trackX0, gaugeY); c.lineTo(trackX1, gaugeY); c.stroke();
  for(let d=0; d<=8; d++){
    const tx = trackX0 + (d/8)*trackW0;
    const isCur = d===battle.distance;
    c.fillStyle = isCur ? '#ffcf5c' : '#ffffff44';
    c.beginPath(); c.arc(tx, gaugeY, isCur?4:1.8, 0, 7); c.fill();
    if(isCur){
      c.fillStyle='#ffcf5c'; c.font='bold 9px sans-serif'; c.textAlign='center';
      c.fillText(d+'/8', tx, gaugeY-8);
    }
  }

  // 自機
  const playerX = 34, playerY = H2/2;
  playerScreenPos.x = playerX; playerScreenPos.y = playerY;
  drawShipIcon(c, playerX, playerY, '#4fd6ff', 1, false, false, player.flashTimer);
  c.fillStyle='#8a94b8'; c.font='10px sans-serif'; c.textAlign='center';
  c.fillText('自艦', playerX, H2-6);

  // 艦載機隊(常駐表示、艦種ごとに戦力に応じて機数が減る)
  player.droneSquadronIds.forEach((did,slotIdx)=>{
    const dInfo = DRONE_SQUADRONS[did];
    if(dInfo.type==='defense'){
      // 防御型は常に自艦の周りを周回して護衛(スロットごとに軌道半径をずらす)
      drawDroneWing(c, playerX, playerY, 1, true, false, did, slotIdx);
    } else {
      const st = battle.droneState[did];
      const attached = st && st.turnsActive>=1 && battle.enemies.some(e=>e.id===st.targetId && e.alive);
      if(!attached){
        drawDroneWing(c, playerX+22, playerY-20-slotIdx*14, 1, false, false, did, slotIdx);
      }
    }
  });

  // 敵(距離値に応じて連続的に位置、前衛はやや手前、後衛はやや奥)
  const trackW = zoneW*3 - 24;
  const zx = zoneX0 + 12 + (battle.distance/8)*trackW;
  let escortHostX = null, escortHostY = null;
  ['front','back','escort'].forEach((rowKey, ri)=>{
    const list = battle.enemies.filter(e=>e.row===rowKey);
    const colOffset = rowKey==='front' ? -zoneW*0.18 : zoneW*0.18;
    const colX = zx + colOffset;
    list.forEach((en,i)=>{
      const spacing = 26;
      const startY = H2/2 - ((list.length-1)*spacing)/2;
      const ey = startY + i*spacing;
      let ex, eyPos;
      if(rowKey==='escort' && escortHostX!==null){
        // 護衛対象(前衛優先、いなければ後衛)の周りを周回する
        const orbitR = 11;
        const phase = performance.now()/1800 + i*(Math.PI*2/Math.max(1,list.length));
        ex = escortHostX + Math.cos(phase)*orbitR;
        eyPos = escortHostY + Math.sin(phase)*orbitR*0.6;
      } else {
        ex = colX; eyPos = ey;
        if(rowKey==='front' && i===0){ escortHostX = ex; escortHostY = eyPos; }
        if(rowKey==='back' && escortHostX===null && i===0){ escortHostX = ex; escortHostY = eyPos; }
      }
      en.screenX = ex; en.screenY = eyPos;
      drawEnemyIcon(c, ex, eyPos, en.type, en.color, -1, !en.alive, en.id===battle.selectedTarget, en.flashTimer);
      if(en.enraged && en.alive){
        c.save();
        const pulse = 0.5+0.5*Math.sin(performance.now()/150);
        c.strokeStyle = `rgba(255,107,107,${0.5+0.4*pulse})`;
        c.lineWidth = 2;
        c.beginPath(); c.arc(ex, eyPos, 15+pulse*3, 0, 7); c.stroke();
        c.restore();
      }
    });
  });

  player.droneSquadronIds.filter(did=>DRONE_SQUADRONS[did].type==='attack').forEach((did,slotIdx)=>{
    const st = battle.droneState[did];
    if(st && st.turnsActive>=1){
      const dTarget = battle.enemies.find(e=>e.id===st.targetId && e.alive);
      if(dTarget) drawDroneWing(c, dTarget.screenX, dTarget.screenY, -1, true, false, did, slotIdx);
    }
  });

  drawBattleEffects(c);
  c.restore();
}

let battle = null; // {encounter, enemies:[{def,type,row,shield,maxShield,id}], band, selectedTarget}

function startBattle(enc){
  inBattle = true;
  battleScreen.classList.add('show');
  battleEffects = [];
  player.flashTimer = 0;
  const surprise = !!(enc.isRandom && !enc.everSeen);
  battle = {
    encounter: enc,
    enemies: enc.enemies.map((e,i)=>{
      const def = ENEMY_DEFS[e.type];
      return {id:i, type:e.type, row:e.row, name:def.name, color:def.color,
        shield:def.maxShield, maxShield:def.maxShield, bands:def.bands, damage:def.damage, weaponType:def.weaponType,
        weaponAccuracy:def.weaponAccuracy, evasion:def.evasion, mobility:def.mobility, unmanned:def.unmanned, drops:def.drops, creditsReward:def.creditsReward, alive:true, flashTimer:0};
    }),
    distance: surprise ? 1 : 4,
    selectedTarget: null,
    totalMaterials: {},
    totalCredits: 0,
    droneState: {},
    roundsElapsed: 0,
  };
  const firstAlive = battle.enemies.find(e=>e.alive);
  battle.selectedTarget = firstAlive ? firstAlive.id : null;
  logClear();
  if(surprise){
    log('=== 奇襲を受けた! ===', '#ff6b6b');
    toast('索敵範囲外から奇襲を受けた!', '#ff6b6b');
    sfxWarn();
  }
  log('戦闘開始! 距離: '+BAND_NAMES[zoneOf(battle.distance)], '#ffcf5c');
  resizeBattleStage();
  renderBattle();
  if(surprise){
    surpriseStrike();
    if(checkPlayerDown()) return;
    renderBattle();
  }
}
function logClear(){ battleLogEl.innerHTML=''; }
function log(msg, color){
  const d = document.createElement('div');
  d.textContent = msg;
  if(color) d.style.color = color;
  battleLogEl.appendChild(d);
  battleLogEl.scrollTop = battleLogEl.scrollHeight;
}

function frontAlive(){ return battle.enemies.some(e=>e.alive && e.row==='front'); }
function escortAlive(){ return battle.enemies.some(e=>e.alive && e.row==='escort'); }
const DAMAGE_VARIANCE = 0.15;
function rollDamage(base){
  const factor = 1 + (Math.random()*2-1)*DAMAGE_VARIANCE;
  return Math.max(1, Math.round(base*factor));
}
function bandMultiplier(bandsArr, band){
  return bandsArr.includes(band) ? 1 : 0;
}
function predictedDamage(w, target){
  if(!battle || !target) return {avg:0, min:0, max:0};
  if(target.row!=='escort' && escortAlive()) return {avg:0, min:0, max:0};
  const mult = bandMultiplier(w.bands, zoneOf(battle.distance));
  if(mult<=0) return {avg:0, min:0, max:0};
  let dmg = w.damage * mult;
  if(target.row==='back' && frontAlive()) dmg *= 0.55; // 前衛に阻まれる期待値込み
  const hitRoll = Math.max(0.1, Math.min(0.95, w.accuracy - target.evasion));
  const avg = dmg * hitRoll; // 命中率・回避を反映した期待値
  const min = dmg * (1-DAMAGE_VARIANCE) * hitRoll;
  const max = dmg * (1+DAMAGE_VARIANCE) * hitRoll;
  return {avg:Math.round(avg), min:Math.round(min), max:Math.round(max)};
}
function predictedDroneDamage(target){
  if(!battle || !target) return {avg:0,min:0,max:0};
  let min=0,max=0,avg=0;
  player.droneSquadronIds.forEach(did=>{
    const d = DRONE_SQUADRONS[did];
    if(d.type!=='attack') return;
    let dmg = d.damage;
    if(target.row==='back' && frontAlive()) dmg *= 0.55;
    const hitRoll = Math.max(0.1, Math.min(0.95, d.accuracy - target.evasion));
    avg += dmg*hitRoll;
    min += dmg*(1-DAMAGE_VARIANCE)*hitRoll;
    max += dmg*(1+DAMAGE_VARIANCE)*hitRoll;
  });
  return {avg:Math.round(avg), min:Math.round(min), max:Math.round(max)};
}
function combinedPredictedDamage(target){
  let min=0,max=0,avg=0;
  player.equippedWeapons.forEach(wid=>{
    const w = effectiveWeaponStats(WEAPONS[wid]);
    if((player.weaponStages[wid]||0)>=3) return;
    const pd = predictedDamage(w, target);
    min+=pd.min; max+=pd.max; avg+=pd.avg;
  });
  if(player.droneSquadronIds.length>0){
    const pd = predictedDroneDamage(target);
    min+=pd.min; max+=pd.max; avg+=pd.avg;
  }
  return {avg,min,max};
}
const REPAIR_COST = {scrap:3, circuit:1};
const REPAIR_COST_LABEL = Object.entries(REPAIR_COST).map(([m,n])=>MAT_NAMES[m]+'x'+n).join('/');
function canAffordRepair(){
  return Object.entries(REPAIR_COST).every(([m,n])=> (player.materials[m]||0) >= n);
}

function renderBattle(){
  // 敵表示: 横一列(前衛/後衛はカード内バッジで区別)
  enemyRowsEl.innerHTML='';
  battle.enemies.forEach(en=>{
    const c = document.createElement('div');
    c.className='enemyCard' + (en.id===battle.selectedTarget?' selected':'') + (!en.alive?' dead':'');
    const atkLabel = en.weaponType==='kinetic' ? '<span style="color:#ff6b6b">実体弾(貫通)</span>' : 'ビーム';
    const enrageLabel = en.enraged ? ' <span style="color:#ff6b6b">【'+(en.unmanned?'暴走':'捨て身')+'】</span>' : (en.fled ? ' <span style="color:#8a94b8">(逃走)</span>' : '');
    const rowBadge = `<span class="rowLabel">${en.row==='front'?'前衛':en.row==='escort'?'防空':'後衛'}</span>`;
    const isProtectedBack = en.row==='back' && frontAlive();
    const isEscortBlocked = en.row!=='escort' && escortAlive();
    const guardWarn = isProtectedBack ? '<div class="erange" style="color:#ff6b6b">⚠ 前衛が健在 ―― 狙っても阻まれやすい(命中率大幅減)</div>' : '';
    const escortWarn = isEscortBlocked ? '<div class="erange" style="color:#5ce1ff">🛡 防空ドローン健在 ―― 攻撃が一切届かない(先に撃破せよ)</div>' : '';
    const droneDebuffTag = isDroneAttachedTo(en) ? '<div class="erange" style="color:#8ce89a">🛸 艦載機に取り付かれ機動力低下(実効機動'+effectiveMobility(en)+')</div>' : '';
    c.innerHTML = `<div class="ename">${rowBadge}<span class="etypeicon ${en.type}" style="background:${en.color}"></span>${en.name}${enrageLabel}</div>
      <div class="ebar-bg"><div class="ebar-fill" style="width:${Math.max(0,en.shield/en.maxShield*100)}%"></div></div>
      <div class="erange">威力${en.damage}(命中${Math.round(en.weaponAccuracy*100)}%) / ${atkLabel}<br>回避${Math.round(en.evasion*100)}% / 機動${en.mobility===0?'固定':en.mobility} / 得意: ${en.bands.map(b=>BAND_NAMES[b]).join('/')}</div>${escortWarn}${guardWarn}${droneDebuffTag}`;
    if(en.enraged) c.style.borderColor = '#ff6b6b';
    else if(en.row==='escort') c.style.borderColor = '#5ce1ff';
    else if(isEscortBlocked) c.style.borderColor = '#5ce1ff88';
    else if(isProtectedBack) c.style.borderColor = '#ff9f4d';
    c.onclick = ()=>{ if(en.alive){ battle.selectedTarget = en.id; renderBattle(); } };
    enemyRowsEl.appendChild(c);
  });

  // キャラ配置ステージ
  drawBattleStage();

  // プレイヤーステータス
  const ar = ARMORS[player.armorId];
  const md = MODULES[player.moduleId];
  const st2 = currentStats();
  const shieldPct = Math.max(0, player.shieldBarrier/st2.maxShieldBarrier*100);
  const hullPct = Math.max(0, player.hull/st2.maxHull*100);
  const energyPct = Math.max(0, player.energy/st2.maxEnergy*100);
  const weaponLines = player.equippedWeapons.map(wid=>{
    const w = effectiveWeaponStats(WEAPONS[wid]);
    return `${w.name}${w.stage>0?' <span style="color:#ff6b6b">['+w.stageName+']</span>':''} — 威力${w.damage} / 命中${Math.round(w.accuracy*100)}% / 有効距離: ${w.bands.map(b=>BAND_NAMES[b]).join('・')} / ${weaponResourceLabel(w)}`;
  }).join('<br>');
  playerBattleStatusEl.innerHTML = `
    <div class="bar-row"><div class="bar-label">SHLD</div><div class="bar-bg"><div class="bar-fill fill-shield" style="width:${shieldPct}%"></div></div><div class="bar-num">${Math.ceil(player.shieldBarrier)}/${st2.maxShieldBarrier}</div></div>
    <div class="bar-row"><div class="bar-label">HULL</div><div class="bar-bg"><div class="bar-fill fill-hull" style="width:${hullPct}%"></div></div><div class="bar-num">${Math.ceil(player.hull)}/${st2.maxHull}</div></div>
    <div class="bar-row"><div class="bar-label">ENRG</div><div class="bar-bg"><div class="bar-fill fill-energy" style="width:${energyPct}%"></div></div><div class="bar-num">${Math.ceil(player.energy)}/${st2.maxEnergy}</div></div>
    <div class="card-sub">装甲: ${ar.name}(船体HP+${ar.hullBonus} / 回避${Math.round(st2.evasion*100)}% / 機動力${st2.mobility}) / モジュール: ${md.name}<br>
    ジェネレーター: ${GENERATORS[player.generatorId].name}(出力 ${currentPowerUsage()}/${currentPowerCapacity()})<br>
    ${player.droneSquadronIds.length>0 ? '艦載機: '+player.droneSquadronIds.map(did=>DRONE_SQUADRONS[did].name+'('+(DRONE_SQUADRONS[did].type==='defense'?'自動迎撃':'距離を問わず攻撃')+' 戦力<span style="color:'+(droneStrengthOf(did)<=30?'#ff6b6b':'#8ce89a')+'">'+droneStrengthOf(did)+'%</span>)').join('、')+'<br>' : ''}
    現在距離: ${battle.distance}/8 (${BAND_NAMES[zoneOf(battle.distance)]})<br>
    ${st2.shieldStageName!=='正常'?'<span style="color:#ff6b6b">シールド発生装置: '+st2.shieldStageName+'(船体損傷で性能低下中)</span><br>':''}
    ${weaponLines}</div>`;

  // コマンド有効/無効 + 予想ダメージ
  const curTarget = battle.enemies.find(e=>e.id===battle.selectedTarget && e.alive);
  const predicted = curTarget ? combinedPredictedDamage(curTarget) : null;
  const curZoneForRange = zoneOf(battle.distance);
  const allWeaponsDown = player.equippedWeapons.every(wid=>(player.weaponStages[wid]||0)>=3);
  const allOutOfRange = curTarget && player.equippedWeapons.every(wid=>{
    if((player.weaponStages[wid]||0)>=3) return true;
    return bandMultiplier(WEAPONS[wid].bands, curZoneForRange) <= 0;
  });
  if(curTarget && allOutOfRange && !allWeaponsDown){
    cmdAttack.textContent = '攻撃(射程外)';
  } else {
    cmdAttack.textContent = '攻撃' + (predicted!==null ? ' (予想'+predicted.min+'~'+predicted.max+')' : '');
  }
  cmdAttack.disabled = turnLock || allWeaponsDown || battle.selectedTarget===null || allOutOfRange;
  cmdClose.disabled = turnLock;
  cmdFar.disabled = turnLock;
  cmdGuard.disabled = turnLock;
  if(battle.encounter.noRetreat){
    cmdRetreat.textContent = '撤退不可';
    cmdRetreat.disabled = true;
  } else if(zoneOf(battle.distance) !== 2){
    cmdRetreat.textContent = '撤退する(遠距離のみ)';
    cmdRetreat.disabled = true;
  } else {
    cmdRetreat.textContent = '撤退する(成功率'+Math.round(RETREAT_CHANCE*100)+'%)';
    cmdRetreat.disabled = turnLock;
  }
  const anyDegraded = player.equippedWeapons.some(wid=>(player.weaponStages[wid]||0)>0);
  cmdRepair.style.display = anyDegraded ? 'inline-block' : 'none';
  if(player.repairKits>0){
    cmdRepair.textContent = '応急修理 (キットx1 所持'+player.repairKits+')';
    cmdRepair.disabled = turnLock;
  } else {
    cmdRepair.textContent = '応急修理 ('+REPAIR_COST_LABEL+')';
    cmdRepair.disabled = turnLock || !canAffordRepair();
  }

  // 武器装備トグル(戦闘中でも最大2門まで切替可能、対象への予想ダメージ付き)
  weaponSelectRowEl.innerHTML='';
  player.ownedWeapons.forEach(wid=>{
    const wDef = effectiveWeaponStats(WEAPONS[wid]);
    const equipped = player.equippedWeapons.includes(wid);
    const chip = document.createElement('div');
    chip.className = 'wchip'+(equipped?' equipped':'');
    const pd = curTarget ? predictedDamage(wDef,curTarget) : null;
    const dmgLabel = pd ? ' 予想'+pd.min+'~'+pd.max : '';
    chip.textContent = wDef.name+' ('+weaponResourceLabel(wDef)+dmgLabel+')'+(equipped?' 装備中':'');
    chip.onclick = ()=>{
      if(turnLock) return;
      sfxClick();
      if(equipped){
        if(player.equippedWeapons.length<=1){ toast('最低1門は装備が必要です', '#ff6b6b'); return; }
        player.equippedWeapons = player.equippedWeapons.filter(x=>x!==wid);
        log(wDef.name+'を装備から外した', '#8a94b8');
      } else {
        if(player.equippedWeapons.length >= maxWeaponSlots()){
          toast('装備枠がいっぱいです('+maxWeaponSlots()+'門まで)', '#ff6b6b');
          return;
        }
        if(currentPowerUsage() + WEAPONS[wid].powerCost > currentPowerCapacity()){
          toast('出力上限を超えるため装備できません', '#ff6b6b');
          return;
        }
        player.equippedWeapons.push(wid);
        log(wDef.name+'を装備した', '#ffcf5c');
      }
      saveGame();
      renderBattle();
      resolveEnemyActions(false, ()=>{ saveGame(); renderBattle(); });
    };
    weaponSelectRowEl.appendChild(chip);
  });
}

function removeRandomEncounterIfAny(){
  if(!battle.encounter.isRandom) return;
  spaceRandomEncounters = spaceRandomEncounters.filter(e=>e.id!==battle.encounter.id);
  stationRandomEncounters = stationRandomEncounters.filter(e=>e.id!==battle.encounter.id);
}
function showVictoryOverlay(){
  const st = document.getElementById('victoryStats');
  st.innerHTML = '';
  const rows = [];
  const destroyedCount = battle.enemies.filter(e=>!e.fled).length;
  const fledCount = battle.enemies.filter(e=>e.fled).length;

function endBattleVictory(){

function endBattleRetreat(){
  log('距離を取り、戦闘から離脱した', '#8a94b8');
  toast('戦闘から離脱した(シールド・エネルギー全快)', '#8a94b8');
  // 撤退直後に同じ敵へまた接触してしまわないよう、プレイヤーを引き離す
  const enc = battle.encounter;
  let dx = player.x - enc.x, dy = player.y - enc.y;
  let d = Math.hypot(dx,dy);
  if(d < 1){ dx = Math.random()-0.5; dy = Math.random()-0.5; d = Math.hypot(dx,dy)||1; }
  const pushDist = 120;
  player.x = Math.max(16, Math.min(W-16, player.x + (dx/d)*pushDist));
  player.y = Math.max(16, Math.min(H-16, player.y + (dy/d)*pushDist));
  player.tx = player.x; player.ty = player.y;
  enc.retreatCooldownUntil = performance.now() + 2000;
  finishBattle();
}
function finishBattle(){
  inBattle = false;
  battleScreen.classList.remove('show');
  const st = currentStats();
  player.shieldBarrier = st.maxShieldBarrier;
  player.energy = st.maxEnergy;
  player.ownedWeapons.forEach(wid=>{ if(WEAPONS[wid].type==='kinetic') player.weaponAmmo[wid] = WEAPONS[wid].maxAmmo; });
  battle = null;
  saveGame();
}

function surpriseStrike(){
  const attacker = battle.enemies.find(e=>e.alive && e.row==='front') || battle.enemies.find(e=>e.alive);
  if(!attacker) return;
  const cst = currentStats();
  const mult = bandMultiplier(attacker.bands, zoneOf(battle.distance));
  if(mult<=0) return;
  const hitRoll = Math.max(0.1, Math.min(0.95, attacker.weaponAccuracy - cst.evasion));
  if(Math.random() > hitRoll){
    log(attacker.name+'の奇襲は外れた', '#4fd6ff');
    return;
  }
  const dmg = rollDamage(attacker.damage * mult);
  const pierce = attacker.weaponType==='kinetic';
  if(tryInterceptAttack(attacker.name)) return;
  const hullHit = applyDamageToPlayer(dmg, pierce);
  player.flashTimer = 1;
  sfxHit();
  spawnBeam(attacker.screenX, attacker.screenY, playerScreenPos.x, playerScreenPos.y, pierce?'#ff6b6b':'#ff9f4d', pierce);
  triggerShake(3, 0.15);
  if(pierce || hullHit){
    log(attacker.name+'の先制攻撃 → 船体に'+Math.round(dmg)+'ダメージ', '#ff6b6b');
    spawnDamageText(playerScreenPos.x, playerScreenPos.y-16, '-'+Math.round(dmg)+' HULL', '#ff6b6b');
  } else {
    log(attacker.name+'の先制攻撃 → シールドが'+Math.round(dmg)+'吸収', '#4fd6ff');
    spawnDamageText(playerScreenPos.x, playerScreenPos.y-16, '-'+Math.round(dmg)+' SHLD', '#4fd6ff');
  }
  rollWeaponDegradeOnHit();
  rollDroneAttritionRandom();
}
let turnLock = false;
function rollDroneAttritionRandom(){
  if(player.droneSquadronIds.length===0) return;
  const alive = player.droneSquadronIds.filter(did=>droneStrengthOf(did)>0);
  if(alive.length===0) return;
  const pick = alive[Math.floor(Math.random()*alive.length)];
  rollDroneAttrition(pick);
}
function rollDroneAttrition(did){
  if(!did || droneStrengthOf(did)<=0) return;
  if(Math.random() < DRONE_ATTRITION_CHANCE){
    const loss = DRONE_ATTRITION_MIN + Math.floor(Math.random()*(DRONE_ATTRITION_MAX-DRONE_ATTRITION_MIN+1));
    player.droneStrengths[did] = Math.max(0, droneStrengthOf(did) - loss);
    const d = DRONE_SQUADRONS[did];
    if(player.droneStrengths[did]<=0){
      log('警告: '+d.name+'が壊滅した!', '#ff6b6b');
      toast(d.name+'壊滅', '#ff6b6b');
    } else {
      log(d.name+'が迎撃を受け勢力を落とした(残り'+player.droneStrengths[did]+'%)', '#ff6b6b');
    }
  }
}
function rollWeaponDegradeOnHit(){
  player.equippedWeapons.forEach(wid=>{
    const stage = player.weaponStages[wid]||0;
    if(stage < 3 && Math.random() < WEAPONS[wid].breakChance){
      player.weaponStages[wid] = stage+1;
      sfxWarn();
      log('警告: '+WEAPONS[wid].name+'が'+WEAPON_DEGRADE_STAGES[stage+1].name+'状態に', '#ff6b6b');
    }
  });
}
function isDroneAttachedTo(en){
  return player.droneSquadronIds.some(did=>{
    if(DRONE_SQUADRONS[did].type!=='attack' || droneStrengthOf(did)<=0) return false;
    const st = battle.droneState[did];
    return st && st.turnsActive>=1 && st.targetId===en.id && en.alive;
  });
}
function effectiveMobility(en){
  return Math.max(0, en.mobility - (isDroneAttachedTo(en) ? DRONE_MOBILITY_DEBUFF : 0));
}
const DRONE_MOBILITY_DEBUFF = 1;
function doSingleEnemyAttack(en, defendActive, cst, preDistance){
  const curZone = zoneOf(preDistance);
  const mult = bandMultiplier(en.bands, curZone);
  if(mult<=0){
    // 射程外: 自分の得意距離へ自ら位置取りする(この行動で攻撃はしない)
    const mob = effectiveMobility(en);
    if(!mob){
      const reason = isDroneAttachedTo(en) ? '艦載機隊にまとわりつかれ機動力を奪われて' : '';
      log(en.name+'は'+reason+'自艦の位置を維持し様子見している', '#8a94b8');
      return;
    }
    const nearestBandZone = en.bands.reduce((a,b)=> Math.abs(b-curZone)<Math.abs(a-curZone)?b:a, en.bands[0]);
    const zoneCenter = nearestBandZone===0?1 : nearestBandZone===1?4 : 7;
    const dir = zoneCenter > preDistance ? 1 : -1;
    const step = Math.min(mob, Math.abs(zoneCenter-preDistance));
    battle.distance = Math.max(0, Math.min(8, battle.distance + dir*step));
    log(en.name+'が距離を'+(dir>0?'離した':'詰めた')+'(機動力'+mob+(isDroneAttachedTo(en)?'、艦載機に妨害され低下中':'')+') → '+BAND_NAMES[zoneOf(battle.distance)], '#8a94b8');
    return;
  }
  let hitRoll = Math.max(0.1, Math.min(0.95, en.weaponAccuracy - cst.evasion));
  if(en.enraged) hitRoll = Math.min(0.97, hitRoll + ENRAGE_ACC_BONUS);
  if(Math.random() > hitRoll){
    log(en.name+'の攻撃を回避した', '#4fd6ff');
    spawnDamageText(playerScreenPos.x, playerScreenPos.y-16, 'MISS', '#4fd6ff');
    sfxEvade();
    return;
  }
  let dmg = en.damage * mult;
  if(en.enraged) dmg *= ENRAGE_DMG_MULT;
  if(defendActive) dmg *= 0.5;
  dmg = rollDamage(dmg);
  const pierce = en.weaponType==='kinetic';
  if(tryInterceptAttack(en.name)) return;
  const hullHit = applyDamageToPlayer(dmg, pierce);
  player.flashTimer = 1;
  sfxHit();
  spawnBeam(en.screenX, en.screenY, playerScreenPos.x, playerScreenPos.y, pierce?'#ff6b6b':'#ff9f4d', pierce);
  triggerShake(3, 0.15);
  if(pierce){
    log(en.name+'の実体弾 → シールド無視で船体に'+Math.round(dmg)+'ダメージ', '#ff6b6b');
    spawnDamageText(playerScreenPos.x, playerScreenPos.y-16, '-'+Math.round(dmg)+' HULL', '#ff6b6b');
  } else if(hullHit){
    log(en.name+'の攻撃 → シールドを貫通し船体に'+Math.round(dmg)+'ダメージ', '#ff6b6b');
    spawnDamageText(playerScreenPos.x, playerScreenPos.y-16, '-'+Math.round(dmg)+' HULL', '#ff6b6b');
  } else {
    log(en.name+'の攻撃 → シールドが'+Math.round(dmg)+'吸収', '#4fd6ff');
    spawnDamageText(playerScreenPos.x, playerScreenPos.y-16, '-'+Math.round(dmg)+' SHLD', '#4fd6ff');
  }
  rollWeaponDegradeOnHit();
  rollDroneAttritionRandom();
}
const FLEE_HP_THRESHOLD = 0.2;
const FLEE_CHANCE = 0.3;
function tryEnemyFlee(en){
  if(en.unmanned) return false; // 無人機/自動化ユニットは逃走しない(何の判定もせず沈黙して隠す)
  if(en.fleeAttempted) return false; // 一戦闘につき一度だけ試行
  if(en.shield > en.maxShield*FLEE_HP_THRESHOLD) return false;
  en.fleeAttempted = true;
  if(Math.random() < FLEE_CHANCE){
    en.alive = false;
    en.fled = true;
    log('=== '+en.name+'が戦線を離脱し、逃走した! ===', '#8a94b8');
    toast(en.name+'を取り逃がした……', '#8a94b8');
    spawnDamageText(en.screenX, en.screenY-16, '逃走', '#8a94b8');
    if(battle.selectedTarget===en.id){
      const na = battle.enemies.find(e=>e.alive);
      battle.selectedTarget = na ? na.id : null;
    }
    return true;
  }
  log(en.name+'は逃走を試みたが失敗した', '#8a94b8');
  return false;
}
function resolveEnemyActions(defendActive, onComplete, preDistance){
  if(preDistance===undefined) preDistance = battle.distance;
  // ターン毎のエネルギー再充填(コア容量に応じた割合回復)
  const cst = currentStats();
  const regenAmt = Math.max(1, Math.round(cst.maxEnergy * 0.12));
  if(player.energy < cst.maxEnergy){
    player.energy = Math.min(cst.maxEnergy, player.energy + regenAmt);
    log('コア再充填 +'+regenAmt+' ENRG', '#c98bff');
  }
  // ターン毎のシールド再生(戦闘中もシールドが機能し続けるように、ただし控えめ)
  if(player.shieldBarrier < cst.maxShieldBarrier){
    const shRegen = Math.max(1, Math.round(cst.maxShieldBarrier * 0.08));
    player.shieldBarrier = Math.min(cst.maxShieldBarrier, player.shieldBarrier + shRegen);
    log('シールド再生 +'+shRegen, '#4fd6ff');
  }

  battle.roundsElapsed += 1;
  // 艦載機隊はどのコマンドを選んでも毎ターン自動で出撃・攻撃する(攻撃型のみ、初動の1ターン目は準備中につき攻撃なし)
  player.droneSquadronIds.filter(did=>DRONE_SQUADRONS[did].type==='attack').forEach(did=>{
    if(battle.roundsElapsed >= 2){
      let dTarget = battle.enemies.find(e=>e.id===battle.selectedTarget && e.alive);
      if(!dTarget) dTarget = battle.enemies.find(e=>e.alive);
      if(dTarget) fireDroneSquadron(did, dTarget);
    } else if(battle.roundsElapsed===1){
      log(DRONE_SQUADRONS[did].name+'が展開準備中(次ターンから攻撃開始)', '#8a94b8');
    }
  });
  renderBattle();
  if(battle.enemies.every(e=>!e.alive)){
    endBattleVictory();
    return;
  }

  const actors = battle.enemies.filter(en=>en.alive);
  turnLock = true;
  let i = 0;
  function step(){
    if(i >= actors.length){
      turnLock = false;
      if(onComplete) onComplete();
      return;
    }
    const en = actors[i]; i++;
    if(!en.alive){ setTimeout(step, 60); return; } // 既に逃走済みならスキップ
    if(tryEnemyFlee(en)){
      renderBattle();
      if(battle.enemies.every(e=>!e.alive)){
        turnLock = false;
        endBattleVictory();
        return;
      }
      setTimeout(step, 420);
      return;
    }
    doSingleEnemyAttack(en, defendActive, cst, preDistance);
    renderBattle();
    if(player.hull<=0){
      turnLock = false;
      finishBattle();
      handlePlayerDeath();
      return; // 全滅、以降の敵の行動はキャンセル
    }
    setTimeout(step, 420);
  }
  setTimeout(step, 320); // 自分の行動演出が落ち着いてから敵が反撃する
}
function checkPlayerDown(){
  if(player.hull<=0){
    finishBattle();
    handlePlayerDeath();
    return true;
  }
  return false;
}
function handlePlayerDeath(){
  document.getElementById('deathOverlay').classList.add('show');
}
document.getElementById('deathContinueBtn').onclick = ()=>{

  document.getElementById('deathOverlay').classList.remove('show');
  respawnAtBase();
  updateHud();
};
document.getElementById('deathNewGameBtn').onclick = ()=>{

  try{ localStorage.removeItem('spaceRpgSave'); }catch(e){}
  location.reload();
};
function dropLootFor(en){
  en.drops.forEach(([mat,min,max,chance])=>{
    if(Math.random()<chance){
      const n = Math.floor(Math.random()*(max-min+1))+min;
      player.materials[mat] = (player.materials[mat]||0)+n;
      if(battle) battle.totalMaterials[mat] = (battle.totalMaterials[mat]||0)+n;
      log('+'+n+' '+MAT_NAMES[mat], '#ffcf5c');
    }
  });
  if(en.creditsReward){
    player.credits += en.creditsReward;
    if(battle) battle.totalCredits += en.creditsReward;
    log('+'+en.creditsReward+' クレジット(撃破報酬)', '#ffcf5c');
  }
  updateMatBar();
  updateHud();
}

const ENRAGE_THRESHOLD = 0.3;
const ENRAGE_DMG_MULT = 1.4;
const ENRAGE_ACC_BONUS = 0.15;
function checkEnrage(en){
  if(!en.enraged && en.shield <= en.maxShield*ENRAGE_THRESHOLD){
    en.enraged = true;
    const label = en.unmanned ? '暴走' : '捨て身';
    const verb = en.unmanned ? '制御を失い暴走状態に陥った' : '捨て身の反撃に転じた';
    log('=== '+en.name+'が'+verb+'! ===', '#ff6b6b');
    toast(en.name+': '+label+'モードに突入', '#ff6b6b');
    spawnDamageText(en.screenX, en.screenY-24, label+'!', '#ff6b6b');
    sfxWarn();
  }
}
const DRONE_ATTRITION_CHANCE = 0.25;
const DRONE_ATTRITION_MIN = 8, DRONE_ATTRITION_MAX = 18;
function fireDroneSquadron(did, target){
  const d = DRONE_SQUADRONS[did];
  const strength = droneStrengthOf(did);
  if(strength<=0){
    log(d.name+'は壊滅しており出撃できない(母船で再編成が必要)', '#8a94b8');
    return;
  }
  if(player.energy < d.energyCost){
    log(d.name+': エネルギー不足で出撃指示できない', '#ff6b6b');
    return;
  }
  player.energy -= d.energyCost;
  // 艦載機は自艦から独立して機動するため距離帯の制約を受けない
  const st = droneState(did);
  const alreadyStationed = st.turnsActive >= 1;
  st.turnsActive += 1;
  st.targetId = target.id;
  sfxFire(d.pierce);
  if(alreadyStationed){
    // 既に目標付近に展開済みなら、その場から発射する
    spawnBeam(target.screenX-18, target.screenY-14, target.screenX, target.screenY, '#8ce89a', d.pierce);
  } else {
    spawnBeam(playerScreenPos.x, playerScreenPos.y-14, target.screenX, target.screenY, '#8ce89a', d.pierce);
  }
  let blockChance = 1;
  if(target.row==='back' && frontAlive()) blockChance = 0.55;
  // 残存戦力は命中率にのみ反映(威力は据え置き)
  const hitRoll = Math.max(0.05, Math.min(0.95, d.accuracy - target.evasion) * (strength/100));
  const escortBlocked = target.row!=='escort' && escortAlive();
  if(escortBlocked){
    log(d.name+': 防空ドローンに迎撃され、攻撃が届かない', '#5ce1ff');
    spawnDamageText(target.screenX, target.screenY-30, '防空', '#5ce1ff');
  } else if(target.row==='back' && frontAlive() && Math.random() > blockChance){
    log(d.name+': 前衛に阻まれ、攻撃が逸れた', '#8a94b8');
    spawnDamageText(target.screenX, target.screenY-30, '阻止', '#8a94b8');
  } else if(Math.random() > hitRoll){
    log(d.name+': '+target.name+'は攻撃を回避した', '#8a94b8');
    spawnDamageText(target.screenX, target.screenY-30, 'MISS', '#8a94b8');
  } else {
    const dmg = rollDamage(d.damage);
    target.shield -= dmg;
    target.flashTimer = 1;
    log(d.name+': '+target.name+'に'+Math.round(dmg)+'ダメージ', '#8ce89a');
    spawnDamageText(target.screenX, target.screenY-30, '-'+Math.round(dmg), '#8ce89a');
    if(target.shield<=0 && target.alive){
      target.alive=false;
      log(target.name+'を撃破!', '#ffcf5c');
      spawnExplosion(target.screenX, target.screenY, target.color);
      sfxExplosion();
      dropLootFor(target);
    } else {
      checkEnrage(target);
    }
  }
}
function fireWeaponAt(wid, target){
  const w = effectiveWeaponStats(WEAPONS[wid]);
  if((player.weaponStages[wid]||0)>=3){ log(w.name+'は機能停止中で発射できない', '#8a94b8'); return; }
  const mult = bandMultiplier(w.bands, zoneOf(battle.distance));
  if(mult<=0){
    log(w.name+': 射程外のため発射しなかった(有効距離: '+w.bands.map(b=>BAND_NAMES[b]).join('・')+')', '#8a94b8');
    return;
  }
  if(w.type==='beam'){
    if(player.energy < w.energyCost){ log(w.name+': エネルギー不足で発射できない', '#ff6b6b'); return; }
    player.energy -= w.energyCost;
  } else {
    ensureAmmo(wid);
    if(player.weaponAmmo[wid] < w.ammoCost){ log(w.name+': 弾切れで発射できない', '#ff6b6b'); return; }
    player.weaponAmmo[wid] -= w.ammoCost;
  }

  sfxFire(w.type==='kinetic');
  spawnBeam(playerScreenPos.x, playerScreenPos.y, target.screenX, target.screenY, w.type==='kinetic'?'#ffcf5c':'#4fd6ff', w.type==='kinetic');

  let blockChance = 1;
  if(target.row==='back' && frontAlive()) blockChance = 0.55;
  const hitRoll = Math.max(0.1, Math.min(0.95, w.accuracy - target.evasion));
  const escortBlocked = target.row!=='escort' && escortAlive();

  if(escortBlocked){
    log(w.name+': 防空ドローンに阻まれ、攻撃が届かない', '#5ce1ff');
    spawnDamageText(target.screenX, target.screenY-16, '防空', '#5ce1ff');
  } else if(target.row==='back' && frontAlive() && Math.random() > blockChance){
    log(w.name+': 前衛に阻まれ、攻撃が逸れた', '#8a94b8');
    spawnDamageText(target.screenX, target.screenY-16, '阻止', '#8a94b8');
  } else if(Math.random() > hitRoll){
    log(w.name+': '+target.name+'は攻撃を回避した', '#8a94b8');
    spawnDamageText(target.screenX, target.screenY-16, 'MISS', '#8a94b8');
    sfxEvade();
  } else {
    const dmg = rollDamage(w.damage * mult);
    target.shield -= dmg;
    target.flashTimer = 1;
    log(w.name+': '+target.name+'に'+Math.round(dmg)+'ダメージ', '#4fd6ff');
    spawnDamageText(target.screenX, target.screenY-16, '-'+Math.round(dmg), '#4fd6ff');
    sfxHit();
    if(target.shield<=0 && target.alive){
      target.alive=false;
      log(target.name+'を撃破!', '#ffcf5c');
      spawnExplosion(target.screenX, target.screenY, target.color);
      sfxExplosion();
      dropLootFor(target);
    } else {
      checkEnrage(target);
    }
  }
}
cmdAttack.onclick = ()=>{
  if(!battle || turnLock) return;
  const preDistance = battle.distance;
  let target = battle.enemies.find(e=>e.id===battle.selectedTarget && e.alive);
  if(!target) return;

  player.equippedWeapons.forEach(wid=>{
    if(!target || !target.alive){
      target = battle.enemies.find(e=>e.alive);
      if(target) battle.selectedTarget = target.id;
    }
    if(!target) return;
    fireWeaponAt(wid, target);
  });

  const stillAlive = battle.enemies.find(e=>e.id===battle.selectedTarget && e.alive);
  if(!stillAlive){ const na = battle.enemies.find(e=>e.alive); battle.selectedTarget = na?na.id:null; }

  renderBattle();
  if(battle.enemies.every(e=>!e.alive)){ endBattleVictory(); return; }
  resolveEnemyActions(false, ()=>{ renderBattle(); }, preDistance);
};

cmdClose.onclick = ()=>{
  if(!battle || turnLock) return;
  sfxClick();
  const preDistance = battle.distance;
  const st = currentStats();
  battle.distance = Math.max(0, battle.distance - st.mobility);
  log('距離を詰めた(機動力'+st.mobility+') → '+BAND_NAMES[zoneOf(battle.distance)], '#4fd6ff');
  renderBattle();
  resolveEnemyActions(false, ()=>{ renderBattle(); }, preDistance);
};
cmdFar.onclick = ()=>{
  if(!battle || turnLock) return;
  sfxClick();
  const preDistance = battle.distance;
  const st = currentStats();
  battle.distance = Math.min(8, battle.distance + st.mobility);
  log('距離を離した(機動力'+st.mobility+') → '+BAND_NAMES[zoneOf(battle.distance)], '#4fd6ff');
  renderBattle();
  resolveEnemyActions(false, ()=>{ renderBattle(); }, preDistance);
};
const RETREAT_CHANCE = 0.65;
cmdRetreat.onclick = ()=>{
  if(!battle || turnLock) return;
  sfxClick();
  if(battle.encounter.noRetreat){
    log('この敵は退路を塞いでいる ―― 撤退できない!', '#ff6b6b');
    toast('撤退不可!', '#ff6b6b');
    return;
  }
  if(zoneOf(battle.distance) !== 2){
    log('遠距離まで離れないと撤退を試みられない', '#ff6b6b');
    return;
  }
  const preDistance = battle.distance;
  const success = Math.random() < RETREAT_CHANCE;
  if(success){
    log('離脱に成功!', '#4fd6ff');
    renderBattle();
    resolveEnemyActions(false, ()=>{ if(battle) endBattleRetreat(); }, preDistance);
  } else {
    log('離脱に失敗した……追撃を受ける!', '#ff6b6b');
    toast('撤退失敗!', '#ff6b6b');
    renderBattle();
    resolveEnemyActions(false, ()=>{ renderBattle(); }, preDistance);
  }
};
cmdGuard.onclick = ()=>{
  if(!battle || turnLock) return;
  sfxClick();
  const preDistance = battle.distance;
  log('防御態勢を取った', '#8a94b8');
  renderBattle();
  resolveEnemyActions(true, ()=>{ renderBattle(); }, preDistance);
};
cmdRepair.onclick = ()=>{
  if(!battle || turnLock) return;
  sfxClick();
  const preDistance = battle.distance;
  if(player.repairKits>0){
    player.repairKits -= 1;
    player.equippedWeapons.forEach(wid=>{
      player.weaponStages[wid] = Math.max(0, (player.weaponStages[wid]||0)-2);
    });
    log('応急修理: 修理キットで装備武装の劣化を2段階分回復した(完全修理は母船で)', '#4fd6ff');
  } else if(canAffordRepair()){
    Object.entries(REPAIR_COST).forEach(([m,n])=> player.materials[m]-=n);
    player.equippedWeapons.forEach(wid=>{
      player.weaponStages[wid] = Math.max(0, (player.weaponStages[wid]||0)-1);
    });
    log('応急修理: 予備部品で装備武装の劣化を1段階分回復した', '#4fd6ff');
    updateMatBar();
  } else {
    log('素材・キット不足で応急修理できない ('+REPAIR_COST_LABEL+')', '#ff6b6b');
    return;
  }
  renderBattle();
  resolveEnemyActions(false, ()=>{ renderBattle(); }, preDistance);
};

/* ============ 起動 ============ */
let lastBattleT = performance.now();
function battleAnimFrame(t){
  const dt = Math.min(0.05, (t-lastBattleT)/1000);
  lastBattleT = t;
  if(inBattle && battle){
    if(player.flashTimer>0) player.flashTimer = Math.max(0, player.flashTimer-dt*4);
    battle.enemies.forEach(en=>{ if(en.flashTimer>0) en.flashTimer = Math.max(0, en.flashTimer-dt*4); });
    updateBattleEffects(dt);
    drawBattleStage();
  }
  requestAnimationFrame(battleAnimFrame);
}

function beginGame(shouldLoad){
  document.getElementById('introOverlay').style.display='none';
  resize();
  if(shouldLoad) loadGame();
  updateHud(); updateMatBar();
  requestAnimationFrame(frame);
  requestAnimationFrame(battleAnimFrame);
}
const hasSave = !!localStorage.getItem('spaceRpgSave');
const loadGameBtn = document.getElementById('loadGameBtn');
const newGameBtn = document.getElementById('newGameBtn');
if(hasSave){
  loadGameBtn.style.display = 'inline-block';
  newGameBtn.textContent = '最初からやり直す';
}
loadGameBtn.onclick = ()=>{ beginGame(true); };
newGameBtn.onclick = ()=>{
  if(hasSave && !confirm('セーブデータを削除して最初から始めます。よろしいですか?')) return;
  if(hasSave){ try{ localStorage.removeItem('spaceRpgSave'); }catch(e){} }
  beginGame(false);
};
document.getElementById('testModeBtn').onclick = ()=>{
  if(hasSave && !confirm('セーブデータを削除してテストモードで開始します。よろしいですか?')) return;
  if(hasSave){ try{ localStorage.removeItem('spaceRpgSave'); }catch(e){} }
  beginGame(false);
  Object.keys(player.materials).forEach(m=>{ player.materials[m] = 50; });
  player.credits = 100;
  updateMatBar(); updateHud();
  toast('テストモード: 素材50・資金100でスタート', '#ffcf5c');
};
resize();
})();
</script>
