<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祈祷の祠 - 星座プランナー</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=Noto+Serif+JP:wght@400;600&display=swap');

:root {
  --bg: #0b0910;
  --bg2: #14101a;
  --panel: #1a1420;
  --panel2: #201828;
  --border: #34283f;
  --text: #ded2c4;
  --text-dim: #8f8290;
  --gold: #c9a24a;
  --gold-bright: #e6c777;
  --c-asc: #b48cf0;
  --c-chaos: #e0475a;
  --c-eld: #4fce8a;
  --c-ord: #e0b23f;
  --c-prim: #4ea8e0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, #2a1f38 0%, transparent 60%),
    linear-gradient(180deg, var(--bg2), var(--bg) 40%);
  color: var(--text);
  font-family: 'Noto Serif JP', serif;
  min-height: 100vh;
  padding: 28px 16px 80px;
}

.wrap { max-width: 980px; margin: 0 auto; }

header {
  text-align: center;
  margin-bottom: 28px;
  position: relative;
}
header::before, header::after {
  content: '';
  display: block;
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 14px auto;
}
h1 {
  font-family: 'Cinzel Decorative', 'Cinzel', serif;
  font-size: 30px;
  letter-spacing: 3px;
  color: var(--gold-bright);
  margin: 0;
  text-shadow: 0 0 24px rgba(230,199,119,0.35);
}
.subtitle {
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 2px;
  margin-top: 4px;
}

.budget-bar {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 18px;
}
.sticky-top {
  position: sticky;
  top: 10px;
  z-index: 20;
  backdrop-filter: blur(6px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  border-radius: 10px;
  padding-bottom: 2px;
  margin-bottom: 20px;
}
.budget-label {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  white-space: nowrap;
}
.budget-track {
  flex: 1;
  height: 10px;
  border-radius: 6px;
  background: #0d0912;
  border: 1px solid var(--border);
  overflow: hidden;
}
.budget-fill {
  height: 100%;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--gold), var(--gold-bright));
  transition: width .3s ease, background .3s ease;
}
.budget-fill.over { background: linear-gradient(90deg, #e0475a, #ff7a86); }
.budget-num {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 16px;
  color: var(--gold-bright);
  min-width: 74px;
  text-align: right;
}
.budget-num.over { color: #ff7a86; }

.affinity-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-bottom: 0;
}
.aff-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 10px;
  text-align: center;
}
.aff-dot {
  width: 22px; height: 22px;
  border-radius: 50%;
  margin: 0 auto 8px;
  box-shadow: 0 0 14px 2px currentColor;
}
.aff-name { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; }
.aff-val { font-family: 'Cinzel', serif; font-weight: 700; font-size: 20px; margin-top: 2px; }
.aff-req { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.aff-req.short { color: #ff7a86; }

.crossroads {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  justify-content: center;
}
.cr-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--panel);
  cursor: pointer;
  font-size: 12px;
  color: var(--text-dim);
  transition: all .15s;
  user-select: none;
}
.cr-toggle.active {
  color: var(--text);
  border-color: currentColor;
  box-shadow: 0 0 10px -2px currentColor;
}
.cr-dot { width: 10px; height: 10px; border-radius: 50%; }

.tier-block { margin-bottom: 30px; }
.tier-title {
  font-family: 'Cinzel', serif;
  font-size: 14px;
  letter-spacing: 3px;
  color: var(--gold);
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
  margin-bottom: 12px;
}

.star-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 10px;
}

.star-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  cursor: pointer;
  transition: all .15s ease;
  position: relative;
}
.star-card:hover { border-color: var(--gold); }
.star-card.selected {
  background: var(--panel2);
  border-color: var(--gold);
  box-shadow: inset 0 0 0 1px var(--gold), 0 0 18px -6px var(--gold);
}
.star-card.locked { opacity: 0.55; }
.star-card.locked.selected { opacity: 1; border-color: #ff7a86; box-shadow: inset 0 0 0 1px #ff7a86; }

.star-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.star-name {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 170px;
}
.star-cost {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  color: var(--gold);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1px 7px;
  white-space: nowrap;
}

.star-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
}
.star-affix { display: flex; gap: 10px; margin-top: 8px; font-size: 11px; color: var(--text-dim); flex-wrap: wrap; }
.affix-group { display: flex; align-items: center; gap: 4px; }
.pip { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.req-warn { color: #ff7a86; font-size: 10.5px; margin-top: 6px; }

.checkbox {
  width: 16px; height: 16px;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.star-card.selected .checkbox { background: var(--gold); border-color: var(--gold); }
.checkbox svg { display: none; width: 10px; height: 10px; }
.star-card.selected .checkbox svg { display: block; }

.footer-note {
  text-align: center;
  color: var(--text-dim);
  font-size: 11px;
  margin-top: 30px;
  line-height: 1.8;
}

.mode-tabs {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 20px;
}
.mode-tab {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: 1.5px;
  padding: 8px 18px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text-dim);
  cursor: pointer;
  transition: all .15s;
}
.mode-tab.active {
  color: var(--bg);
  background: var(--gold);
  border-color: var(--gold);
}

.target-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px;
  margin-bottom: 20px;
}
.target-panel-title {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: 1.5px;
  color: var(--gold);
  margin-bottom: 10px;
}
.target-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
  min-height: 20px;
}
.target-chip {
  font-size: 12px;
  background: var(--panel2);
  border: 1px solid var(--gold);
  color: var(--gold-bright);
  border-radius: 14px;
  padding: 4px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.target-chip .x { cursor: pointer; opacity: .7; }
.target-chip .x:hover { opacity: 1; color: #ff7a86; }
.target-empty { font-size: 12px; color: var(--text-dim); }

.deficit-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.deficit-pill {
  font-size: 11px;
  border-radius: 10px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
}
.deficit-pill.ok { color: var(--text-dim); }
.deficit-pill.need { border-color: #ff7a86; color: #ff9aa3; }

.solve-btn {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: 1px;
  background: var(--gold);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  padding: 9px 18px;
  cursor: pointer;
  font-weight: 700;
}
.solve-btn:hover { background: var(--gold-bright); }
.solve-btn:disabled { background: var(--border); color: var(--text-dim); cursor: default; }

.suggest-result { margin-top: 12px; font-size: 12px; color: var(--text-dim); line-height: 1.9; }
.suggest-result .item { color: var(--text); }
.suggest-result .cost { color: var(--gold); }

.star-tag-btn {
  width: 22px; height: 22px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-dim);
  flex-shrink: 0;
  font-size: 13px;
  transition: all .15s;
}
.star-tag-btn.is-target { color: var(--gold); border-color: var(--gold); background: rgba(230,199,119,0.12); }

.star-card.suggested { border-color: var(--c-eld); box-shadow: inset 0 0 0 1px var(--c-eld); }
.suggested-badge {
  position: absolute; top: 10px; right: 10px;
  font-size: 9px; letter-spacing: .5px;
  background: var(--c-eld); color: #0b1f14;
  border-radius: 4px; padding: 1px 6px;
  font-weight: 700;
}
.star-card.excluded { opacity: 0.4; }
.excluded-badge {
  position: absolute; top: 10px; right: 10px;
  font-size: 9px; letter-spacing: .5px;
  background: var(--c-chaos); color: #2a0a0d;
  border-radius: 4px; padding: 1px 6px;
  font-weight: 700;
}
.star-tag-btn.is-excluded { color: var(--c-chaos); border-color: var(--c-chaos); background: rgba(224,71,90,0.12); }
.star-tag-btn.is-partial { color: var(--c-ord); border-color: var(--c-ord); background: rgba(224,178,63,0.12); }

.partial-control {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin-top: 8px;
  padding: 8px 10px;
  background: rgba(224,178,63,0.06);
  border: 1px solid var(--c-ord);
  border-radius: 6px;
  max-height: 220px;
  overflow-y: auto;
  overflow-x: hidden;
}
.node-row {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  width: 100%;
  box-sizing: border-box;
  padding: 5px 0;
  cursor: pointer;
  font-size: 11px;
  line-height: 1.5;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.node-row:last-child { border-bottom: none; }
.node-row input[type="checkbox"] { margin-top: 2px; accent-color: var(--c-ord); flex-shrink: 0; }
.node-label { color: var(--c-ord); font-family: 'Cinzel', serif; font-size: 10px; flex-shrink: 0; min-width: 18px; }
.node-text { color: var(--text); flex: 1 1 auto; min-width: 0; white-space: normal; word-break: break-word; }
.node-pet { display: block; color: var(--c-prim); font-size: 10.5px; margin-top: 2px; }
.node-pc-label { color: var(--gold); font-size: 9.5px; }
.partial-summary { font-size: 10px; color: var(--text-dim); margin-top: 6px; }
.reset-btn {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 1px;
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 14px;
  cursor: pointer;
  white-space: nowrap;
}
.reset-btn:hover { color: #ff9aa3; border-color: #ff7a86; }

.cr-x {
  width: 16px; height: 16px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-size: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  margin-left: 2px;
}
.cr-x:hover, .cr-x.active { color: var(--c-chaos); border-color: var(--c-chaos); background: rgba(224,71,90,0.12); }

.quick-calc-btn {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 1px;
  background: var(--panel2);
  color: var(--gold-bright);
  border: 1px solid var(--gold);
  border-radius: 8px;
  padding: 6px 14px;
  cursor: pointer;
  white-space: nowrap;
}
.quick-calc-btn:hover { background: var(--gold); color: var(--bg); }

.summary-btn-wrap { position: relative; }
.summary-btn {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 1px;
  background: var(--panel2);
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 14px;
  cursor: default;
  white-space: nowrap;
}
.summary-btn { cursor: pointer; }
.summary-btn-wrap:hover .summary-btn { color: var(--gold-bright); border-color: var(--gold); }
.summary-tooltip {
  display: none;
  position: absolute;
  right: 0;
  top: calc(100% + 10px);
  width: 320px;
  max-height: 420px;
  overflow-y: auto;
  background: #0a0810;
  border: 1px solid var(--gold);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 12px;
  line-height: 1.9;
  color: var(--text);
  box-shadow: 0 12px 32px rgba(0,0,0,0.65);
  z-index: 60;
  text-align: left;
}
.summary-tooltip.open { display: block; }
.summary-tooltip .st-row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--border); padding: 3px 0; }
.summary-tooltip .st-label { color: var(--text-dim); }
.summary-tooltip .st-val { color: var(--gold-bright); white-space: nowrap; }
.summary-tooltip .st-empty { color: var(--text-dim); text-align: center; padding: 10px 0; }
.summary-tooltip .st-section {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--gold);
  margin: 10px 0 4px;
  padding-bottom: 3px;
  border-bottom: 1px solid var(--gold);
}
.summary-tooltip .st-section:first-child { margin-top: 0; }
.summary-tooltip .st-cat {
  font-size: 9.5px;
  color: var(--text-dim);
  letter-spacing: 1px;
  margin: 6px 0 2px;
  padding-left: 2px;
  border-left: 2px solid var(--gold);
}

.slot-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.slot-card {
  flex: 1;
  min-width: 130px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
}
.slot-card.filled { border-color: var(--gold); }
.slot-title {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  color: var(--gold);
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.slot-summary { font-size: 10.5px; color: var(--text-dim); line-height: 1.6; min-height: 32px; }
.slot-summary .empty { color: var(--text-dim); opacity: .6; }
.slot-btns { display: flex; gap: 6px; margin-top: 8px; }
.slot-btn {
  flex: 1;
  font-size: 10px;
  font-family: 'Cinzel', serif;
  padding: 5px 0;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--text-dim);
  cursor: pointer;
  text-align: center;
}
.slot-btn:hover { color: var(--gold-bright); border-color: var(--gold); }
.slot-btn.danger:hover { color: #ff9aa3; border-color: #ff7a86; }

.compare-btn {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 1px;
  background: var(--panel2);
  color: var(--gold-bright);
  border: 1px solid var(--gold);
  border-radius: 8px;
  padding: 6px 14px;
  cursor: pointer;
  white-space: nowrap;
}
.compare-btn:hover { background: var(--gold); color: var(--bg); }

.compare-panel {
  background: var(--panel);
  border: 1px solid var(--gold);
  border-radius: 10px;
  padding: 16px 18px;
  margin-bottom: 20px;
  overflow-x: auto;
}
.compare-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 500px; }
.compare-table th, .compare-table td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
.compare-table th { font-family: 'Cinzel', serif; color: var(--gold); font-size: 10.5px; letter-spacing: .5px; }
.compare-table td.names { white-space: normal; font-size: 11px; color: var(--text-dim); max-width: 220px; }

.star-tooltip {
  display: none;
  position: fixed;
  min-width: 220px;
  max-width: 320px;
  max-height: 70vh;
  overflow-y: auto;
  background: #0a0810;
  border: 1px solid var(--gold);
  border-radius: 8px;
  padding: 10px 13px;
  font-size: 11.5px;
  line-height: 1.75;
  color: var(--text);
  box-shadow: 0 12px 32px rgba(0,0,0,0.65);
  z-index: 200;
  white-space: pre-line;
  pointer-events: none;
  text-align: left;
}
.star-tooltip.show { display: block; }
.star-tooltip .tt-title {
  color: var(--gold-bright);
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: .5px;
  margin-bottom: 4px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
}

@media (max-width: 640px) {
  .affinity-row { grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .aff-card { padding: 8px 4px; }
  .aff-val { font-size: 16px; }
  h1 { font-size: 22px; letter-spacing: 1.5px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>祈祷の祠</h1>
    <div class="subtitle">星座(デボーション)プランナー</div>
  </header>

  <div class="footer-note" style="margin-top:0; margin-bottom:20px;">
    要親和性は「現在の合計付与親和性」が満たしていれば解禁されます(消費されません)。<br>
    〇 = 目標として確定取得(要求親和性を満たせば完成、親和性付与あり) / × = 逆引き候補から除外 / △ = 途中まで取得(コストのみ加算、親和性は未付与)<br>
    赤い枠は親和性不足で実際には解禁できていない星座です。全55ptが祈祷ポイントの上限。
  </div>

  <div class="sticky-top">
    <div class="budget-bar">
      <div class="budget-label">祈祷ポイント</div>
      <div class="budget-track"><div class="budget-fill" id="budgetFill"></div></div>
      <div class="budget-num" id="budgetNum">0 / 55</div>
      <button class="quick-calc-btn" id="quickCalcBtn">目標を計算</button>
      <div class="summary-btn-wrap">
        <div class="summary-btn" id="summaryBtn">合計ボーナス ▾</div>
        <div class="summary-tooltip" id="summaryTooltip"></div>
      </div>
      <button class="reset-btn" id="resetBtn">リセット</button>
    </div>

    <div class="affinity-row" id="affinityRow"></div>
  </div>

  <div class="slot-bar" id="slotBar"></div>
  <div style="text-align:center;margin-bottom:20px;">
    <button class="compare-btn" id="compareBtn">保存枠を比較</button>
  </div>
  <div class="compare-panel" id="comparePanel" style="display:none;"></div>

  <div class="mode-tabs">
    <div class="mode-tab" id="tabManual">手動で選ぶ</div>
    <div class="mode-tab" id="tabTarget">目標から逆引き</div>
  </div>

  <div class="target-panel" id="targetPanel" style="display:none;">
    <div class="target-panel-title">対象に指定した星座(〇確定取得 / △途中まで取得)</div>
    <div class="target-chips" id="targetChips"></div>
    <div class="deficit-row" id="deficitRow"></div>
    <button class="solve-btn" id="solveBtn">最小コストの経路を計算</button>
    <div class="suggest-result" id="suggestResult"></div>
  </div>

  <div class="crossroads" id="crossroadsRow"></div>

  <div id="tiers"></div>
</div>

<div class="star-tooltip" id="sharedTooltip"><div class="tt-title">ボーナス合計(重複分)</div><div id="sharedTooltipBody"></div></div>

<script>

// desc文字列(「N: 内容」形式の行の集合)からノード一覧を抽出
// テキストから「ペットボーナス(...)」部分を分離し、PC用/ペット用に分ける
function splitPetBonus(text){
  const m = text.match(/[、,]?\s*ペットボーナス\s*[:：]?\s*\(([^)]*)\)/);
  if (!m) return { main: text, pet: null };
  const main = text.replace(m[0], '').trim().replace(/[、,]\s*$/, '');
  return { main, pet: m[1].trim() };
}

function parseOrderNodes(desc){
  if (!desc) return [];
  return desc.split('\n').map(line => {
    const m = line.match(/^(\d+[a-z]?): (.+)$/);
    return m ? { label: m[1], text: m[2].trim() } : null;
  }).filter(Boolean);
}

function effectiveCost(key, item){
  return state.partial.has(key) ? state.partial.get(key).size : item[1];
}
function effectiveGrant(key, item){
  // 親和性は星座を完成させて初めて付与される(部分投資では付与されない)
  if (state.partial.has(key)) return z();
  return item[3];
}

function totalCost(){
  let c = 0;
  AFF.forEach(a => { if (state.crossroads[a]) c += 1; });
  state.selected.forEach(key => {
    const item = findItem(key);
    if (item) c += effectiveCost(key, item);
  });
  return c;
}

function findItem(key){
  const [tier, idx] = key.split('-');
  const arr = tier === 't1' ? TIER1 : tier === 't2' ? TIER2 : TIER3;
  return arr[parseInt(idx)];
}

// 英名+日本語名の文字列から日本語部分だけを抜き出す
function jaOnly(name){
  const m = name.match(/[\u3040-\u30FF\u3400-\u9FFF\uFF00-\uFFEF][\s\S]*$/);
  return m ? m[0].trim() : name;
}

function grantedTotals(){
  const g = z();
  AFF.forEach(a => { if (state.crossroads[a]) g[a] += 1; });
  state.selected.forEach(key => {
    const item = findItem(key);
    if (!item) return;
    const grant = effectiveGrant(key, item);
    AFF.forEach(a => { g[a] += (grant[a]||0); });
  });
  return g;
}

function allTier1(){ return TIER1.map((item, idx) => ({ key: `t1-${idx}`, item })); }

// 目標星座を満たすために必要な、色ごとの最大要求値
// 目標(〇)または部分取得(△)に指定された星座を「解禁したい対象」として扱う
function goalKeys(){
  return new Set([...state.targets, ...state.partial.keys()]);
}

function targetMaxReq(){
  const req = z();
  goalKeys().forEach(key => {
    const item = findItem(key);
    if (!item) return;
    AFF.forEach(a => { req[a] = Math.max(req[a], item[2][a]||0); });
  });
  return req;
}

// 逆引き計算の基準:岐路の実際の状態 + 既存の(目標以外の)選択済み星座 + 目標自身の完成時付与
function currentGrantedExcludingSuggested(){
  const g = z();
  AFF.forEach(a => { if (state.crossroads[a]) g[a] += 1; });
  state.targets.forEach(key => {
    const item = findItem(key);
    if (!item) return;
    AFF.forEach(a => { g[a] += (item[3][a]||0); });
  });
  state.selected.forEach(key => {
    if (state.targets.has(key)) return;
    const item = findItem(key);
    if (!item) return;
    const grant = effectiveGrant(key, item);
    AFF.forEach(a => { g[a] += (grant[a]||0); });
  });
  return g;
}

function computeDeficit(){
  const maxReq = targetMaxReq();
  const granted = currentGrantedExcludingSuggested();
  const deficit = z();
  AFF.forEach(a => { deficit[a] = Math.max(0, maxReq[a] - granted[a]); });
  return { maxReq, granted, deficit };
}

// 貪欲法: 不足親和性を最小コストで埋める組み合わせを Tier1/Tier2 + 岐路 から探す
// 「リセット直後」を基準にするため、既に選択済みかどうかは無視し、目標/除外以外は全て候補にする
function solveSuggestions(){
  // 前回の逆引き計算で自動追加された推奨分は、比較しやすいよう再計算のたびに巻き戻す
  state.suggested.forEach(key => state.selected.delete(key));
  state.suggested.clear();
  state.suggestedCrossroads.forEach(a => { state.crossroads[a] = false; });
  state.suggestedCrossroads.clear();

  const { deficit } = computeDeficit();
  let granted = currentGrantedExcludingSuggested();
  const totalDeficit = () => AFF.reduce((s,a)=>s+deficit[a],0);
  const chosen = [];
  const chosenKeys = new Set();     // このソルブ実行中に既に選んだ星座
  const chosenCrossroads = new Set(); // このソルブ実行中に既に選んだ岐路の色
  let guard = 0;

  while (totalDeficit() > 0 && guard < 80) {
    guard++;

    const crossroadCandidates = AFF.filter(a => !state.crossroadExcluded.has(a) && !chosenCrossroads.has(a) && !state.crossroads[a]).map(a => ({
      key: `cr-${a}`, cost: 1, grant: {[a]:1}, label: `岐路(${AFF_LABEL[a]})`
    }));
    const t1Candidates = TIER1.map((item, idx) => {
      const key = `t1-${idx}`;
      if (state.targets.has(key) || state.excluded.has(key) || chosenKeys.has(key) || state.selected.has(key)) return null;
      return { key, cost: item[1], grant: item[3], label: jaOnly(item[0]) };
    }).filter(Boolean);
    const t2Candidates = TIER2.map((item, idx) => {
      const key = `t2-${idx}`;
      if (state.targets.has(key) || state.excluded.has(key) || chosenKeys.has(key) || state.selected.has(key)) return null;
      if (!reqSatisfied(item[2], granted)) return null; // まだ解禁できない
      return { key, cost: item[1], grant: item[3], label: jaOnly(item[0]) + '(T2)' };
    }).filter(Boolean);

    const pool = [...crossroadCandidates, ...t1Candidates, ...t2Candidates];
    let best = null, bestScore = 0;
    for (const c of pool) {
      const usefulness = AFF.reduce((s,a)=> s + Math.min(deficit[a], c.grant[a]||0), 0);
      if (usefulness <= 0) continue;
      const score = usefulness / c.cost;
      if (score > bestScore) { bestScore = score; best = c; }
    }
    if (!best) break;

    chosen.push(best);
    if (best.key.startsWith('cr-')) {
      const a = best.key.slice(3);
      chosenCrossroads.add(a);
      state.crossroads[a] = true; // 実際の選択にも反映
      state.suggestedCrossroads.add(a); // 推奨扱いとして記録(次回計算時に巻き戻す対象)
    } else {
      chosenKeys.add(best.key);
      state.suggested.add(best.key);
      state.selected.add(best.key); // 実際の選択にも反映
    }
    AFF.forEach(a => {
      granted[a] += (best.grant[a]||0);
      deficit[a] = Math.max(0, deficit[a] - (best.grant[a]||0));
    });
  }

  return { chosen, remaining: deficit, solved: totalDeficit() <= 0 };
}

function reqSatisfied(req, granted){
  return AFF.every(a => (granted[a]||0) >= (req[a]||0));
}

  );

  return `<div class="star-affix"><span style="color:var(--text-dim)">${prefix}</span>${parts.join('')}</div>`;

    const dispCost = isPartial ? `${state.partial.get(key).size}/${cost}pt` : `${cost}pt`;
    const nodes = parseOrderNodes(desc);

      + (selected && !ok ? ' locked' : '')
      + (isSuggested ? ' suggested' : '')
      + (isExcluded ? ' excluded' : '');
    card.innerHTML = `
      ${isSuggested ? '<div class="suggested-badge">推奨</div>' : ''}
      ${!isSuggested && isExcluded ? '<div class="excluded-badge">除外中</div>' : ''}
      <div class="star-top">
        <div style="display:flex;align-items:flex-start;gap:8px;min-width:0;">
          <div class="checkbox"><svg viewBox="0 0 10 10"><path d="M1 5l2.5 2.5L9 1.5" stroke="#1a1420" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="star-name">${jaOnly(name)}</div>
        </div>
        <div class="star-cost">${dispCost}</div>
      </div>
      <div class="star-actions">
        ${(tierKey === 't1' || tierKey === 't2') ? `<div class="star-tag-btn${isExcluded ? ' is-excluded' : ''}" title="取得しない(逆引き候補から除外)">×</div>` : ''}
        <div class="star-tag-btn${isPartial ? ' is-partial' : ''}" title="途中まで取得">△</div>
        <div class="star-tag-btn${isTarget ? ' is-target' : ''}" title="取得する(目標)">〇</div>
      </div>
      ${affixHTML(req, '要求')}
      ${affixHTML(grant, '付与')}
      ${isPartial ? `
        <div class="partial-control" data-partial-control>
          ${nodes.length === 0 ? '<div style="color:var(--text-dim);font-size:11px;">(ノード情報なし)</div>' : nodes.map(n => {
            const { main, pet } = splitPetBonus(n.text);
            return `
            <label class="node-row" data-node-label="${n.label}">
              <input type="checkbox" data-node-checkbox="${n.label}" ${state.partial.get(key).has(n.label) ? 'checked' : ''}>
              <span class="node-label">${n.label}</span>
              <span class="node-text">${pet ? '<span class="node-pc-label">PC: </span>' : ''}${main}${pet ? `<span class="node-pet">ペット: ${pet}</span>` : ''}</span>
            </label>
          `;
          }).join('')}
        </div>
        <div class="partial-summary">取得中: ${state.partial.get(key).size} / ${nodes.length || cost} 項目・親和性は未付与(コストのみ加算)</div>
      ` : ''}
      ${selected && !ok ? '<div class="req-warn">⚠ 親和性不足で未解禁</div>' : ''}
    `;
    if (tierKey === 't1' || tierKey === 't2') {
      card.querySelector('[title="取得しない(逆引き候補から除外)"]').onclick = (e) => {
        e.stopPropagation();
        if (state.excluded.has(key)) { state.excluded.delete(key); }
        else {
          state.excluded.add(key);
          state.targets.delete(key);
          state.partial.delete(key);
          state.suggested.delete(key);
          state.selected.delete(key);
        }
        renderAll();
      };
    }
    card.querySelector('[title="途中まで取得"]').onclick = (e) => {
      e.stopPropagation();
      if (state.partial.has(key)) {
        state.partial.delete(key);
      } else {
        const nodeSet = new Set();
        if (nodes.length > 0) nodeSet.add(nodes[0].label); // 最初のノードだけ初期選択
        state.partial.set(key, nodeSet);
        state.selected.add(key);
        state.suggested.delete(key);
        state.excluded.delete(key);
        state.targets.delete(key);
      }
      renderAll();
    };
    card.querySelector('[title="取得する(目標)"]').onclick = (e) => {
      e.stopPropagation();
      if (state.targets.has(key)) { state.targets.delete(key); }
      else {
        state.targets.add(key);
        state.selected.add(key);
        state.suggested.delete(key);
        state.partial.delete(key);
        state.excluded.delete(key);
      }
      renderAll();
    };
    const partialControl = card.querySelector('[data-partial-control]');
    if (partialControl) {
      partialControl.onclick = (e) => e.stopPropagation();
      partialControl.querySelectorAll('[data-node-checkbox]').forEach(cb => {
        cb.onchange = () => {
          const label = cb.dataset.nodeCheckbox;
          const set = state.partial.get(key);
          if (!set) return;
          if (cb.checked) set.add(label); else set.delete(label);
          if (set.size === 0) {
            // 全部外したら部分取得自体を解除
            state.partial.delete(key);
            state.selected.delete(key);
          }
          renderAll();
        };
      });
    }
    card.onclick = () => {
      hideTooltip();
      if (state.targets.has(key)) return;
      if (state.partial.has(key)) return;
      state.suggested.delete(key);
      if (state.selected.has(key)) state.selected.delete(key);
      else { state.selected.add(key); state.excluded.delete(key); }
      renderAll();
    };
    card.addEventListener('mouseenter', () => showTooltip(card, desc));
    card.addEventListener('mouseleave', hideTooltip);
    grid.appendChild(card);
  });

  block.appendChild(grid);
  return block;
}

// 星座の効果テキストから "+N% ラベル" 形式のステータスを抜き出す (PC/ペットを区別して返す)
const CANONICAL_LABEL = {
  'エレ耐性': 'エレメンタル耐性',
  'エレダメ': 'エレメンタルダメージ',
  'エレダメージ': 'エレメンタルダメージ',
  'エレ': 'エレメンタル',
  '近接攻撃回避率': '近接回避率',
  '投射物回避率': '投射回避率',
  'エナジー量再生': 'エナジー再生',
  'エナジー再生増加量': 'エナジー再生量増加',
  'ヘルス再生増加': 'ヘルス再生量増加',
  '防御': '防御能力',
  '攻撃': '攻撃能力',
};
function parseDescStats(desc){
  const results = [];
  if (!desc) return results;

  // 星座スキルのブロック(発動条件など)は集計対象外
  let body = desc.split('\n\n【星座スキル】')[0];

  const lines = body.split('\n');
  for (const rawLine of lines) {
    let line = rawLine.trim();
    if (!line) continue;
    line = line.replace(/^\d+[a-z]*:\s*/, ''); // 複数文字の分岐ラベル(4ba, 5bb等)にも対応
    if (!line || line.startsWith('(') || line.startsWith('【')) continue;
    if (line.includes('星座スキル獲得')) continue;

    const petMatches = [...line.matchAll(/ペットボーナス\s*[:：]?\s*[（(]([^）)]*)[）)]/g)];
    let mainLine = line.replace(/[、,]?\s*ペットボーナス\s*[:：]?\s*[（(][^）)]*[）)]/g, '').trim();

    let lineMainLastLabel = null; // このノードのPC側で最後に出てきた耐性/効果名(ペット側の「同耐性」参照用)

    const extractStats = (text, isPet) => {
      // 事前処理: レンジ表記(6-10)は上限値のみ残す、特攻系・発動率プレフィックスは除去、括弧は除去
      const cleaned = text
        .replace(/(\d+)-(\d+)(?=\s*[^\d+\-]|$)/g, '$2')
        .replace(/(アンデッド|ビースト|クトーニック|人間)(\/(アンデッド|ビースト|クトーニック|人間))*特攻/g, '')
        .replace(/\d+%?\s*の?\s*確率で\s*/g, '')
        .replace(/攻撃ダメージを?ヘルスに変換/g, '攻撃ダメージ変換')
        .replace(/[()（）]/g, '')
        .replace(/、\s*、/g, '、');

      const rawSegments = cleaned.split(/[、,]/).map(s => s.trim()).filter(Boolean);

      // "80% 出血ダメージ +50% 延長" のように延長が同じ塊に同居してる場合は分離
      const segments = [];
      for (const seg of rawSegments) {
        const extMatch = seg.match(/^(.*?)\s*([+\-]?\d+(?:\.\d+)?%)\s*延長$/);
        if (extMatch && /\d/.test(extMatch[1])) {
          segments.push(extMatch[1].trim());
          segments.push({ ext: extMatch[2], base: extMatch[1].trim() });
        } else {
          segments.push(seg);
        }
      }

      const suffixWords = ['吸収耐性','ダメージ','耐性','短縮','報復','削減','変換','向上','増加','能力','回避率','速度'];
      const parseSeg = (seg) => {
        const nums = seg.match(/[+\-]?\d+(?:\.\d+)?%?/g);
        if (!nums || nums.length === 0) return null;
        const value = nums[0];
        let label = seg.replace(value, '').trim().replace(/^[のを]/, '').trim();
        label = label.replace(/\/+$/g, '').replace(/^\/+/g, '').trim();
        if (!label) return null;
        if (/^[秒分s]$/.test(label)) return null;
        label = label.replace(/ダメ(?!ージ)/g, 'ダメージ');
        if (label === 'クリティカル') label = 'クリティカルダメージ';
        return { value, label };
      };

      let lastMainLabel = isPet ? lineMainLastLabel : null;
      for (const seg of segments) {
        if (typeof seg === 'object' && seg.ext) {
          const parsed = parseSeg(seg.base);
          const baseLabel = parsed ? parsed.label : lastMainLabel;
          if (baseLabel) results.push({ raw: seg.ext, label: baseLabel + '(延長)', pet: isPet });
          continue;
        }
        const parsed = parseSeg(seg);
        if (!parsed) continue;
        let { value, label } = parsed;

        // 単体で「延長」だけが残った場合は直前の主ラベルに紐付ける
        if (label === '延長') {
          if (lastMainLabel) results.push({ raw: value, label: lastMainLabel + '(延長)', pet: isPet });
          continue;
        }
        // 「同耐性」「同」= 直前と同じ耐性名を指す表記(ペットボーナス欄でよく使われる)
        if (/^同(耐性)?$/.test(label) && lastMainLabel) {
          label = lastMainLabel;
        }

        let labels = [label];
        if (label.includes('/')) {
          const foundSuffix = suffixWords.find(sfx => label.endsWith(sfx));
          if (foundSuffix) {
            const base = label.slice(0, -foundSuffix.length);
            const parts = base.split('/').map(p => p.replace(/^\d+\s*/, '').trim()).filter(Boolean);
            if (parts.length > 1) labels = parts.map(p => p + foundSuffix);
          } else {
            const parts = label.split('/').map(p => p.replace(/^\d+\s*/, '').trim()).filter(Boolean);
            const looksLikeUnit = parts.some(p => /^\d*s$/i.test(p));
            if (parts.length > 1 && !looksLikeUnit) labels = parts;
          }
        }
        labels = labels.map(l => CANONICAL_LABEL[l] || l);
        labels.forEach(l => results.push({ raw: value, label: l, pet: isPet }));
        lastMainLabel = labels[labels.length - 1];
      }
      if (!isPet) lineMainLastLabel = lastMainLabel;
    };

    extractStats(mainLine, false);
    petMatches.forEach(pm => extractStats(pm[1], true));
  }
  return results;
}

// ラベルからカテゴリを判定
const CATEGORY_ORDER = ['攻撃', '防御', 'ダメージ', '耐性減少', '耐性', 'ヘルス回復', 'その他'];
function categorize(label){
  const base = label.replace(/\(延長\)$/, '');
  if (base.includes('耐性減少')) return '耐性減少';
  if (/耐性$/.test(base)) return '耐性';
  if (base.includes('攻撃能力')) return '攻撃';
  if (base.includes('防御能力')) return '防御';
  if (/ヘルス(再生|回復)|治癒向上/.test(base)) return 'ヘルス回復';
  if (/ダメージ$|^延長$/.test(label) || label.includes('(延長)')) return 'ダメージ';
  return 'その他';
}

// 完全に取得済み(△の部分取得は除く)の星座の効果を、PC用/ペット用に分けて合算する
function aggregateTakenBonuses(){
  const pcTotals = new Map();   // label -> {sum, label, unit, category}
  const petTotals = new Map();
  const allArrs = [['t1', TIER1], ['t2', TIER2], ['t3', TIER3]];
  allArrs.forEach(([tierKey, arr]) => {
    arr.forEach((item, idx) => {
      const key = `${tierKey}-${idx}`;
      if (!state.selected.has(key)) return;
      if (state.partial.has(key)) return; // 未完成は集計に含めない
      const desc = item[4];
      const stats = parseDescStats(desc);
      stats.forEach(s => {
        const isPct = s.raw.includes('%');
        const num = parseFloat(s.raw.replace('%',''));
        const mapKey = s.label + (isPct ? '%' : '');
        const target = s.pet ? petTotals : pcTotals;
        if (!target.has(mapKey)) target.set(mapKey, { sum: 0, label: s.label, unit: isPct ? '%' : '', category: categorize(s.label) });
        target.get(mapKey).sum += num;
      });
    });
  });
  return { pc: [...pcTotals.values()], pet: [...petTotals.values()] };
}

function renderSummaryTooltip(){
  const el = document.getElementById('summaryTooltip');
  const { pc, pet } = aggregateTakenBonuses();
  if (pc.length === 0 && pet.length === 0) {
    el.innerHTML = '<div class="st-empty">取得済み星座の効果がここに合算表示されます</div>';
    return;
  }

  const groupedHtml = (rows) => {
    const byCategory = {};
    rows.forEach(r => { (byCategory[r.category] = byCategory[r.category] || []).push(r); });
    return CATEGORY_ORDER.filter(c => byCategory[c] && byCategory[c].length).map(cat => {
      const catRows = byCategory[cat]
        .sort((a,b) => Math.abs(b.sum) - Math.abs(a.sum))
        .map(r => {
          const sign = r.sum > 0 ? '+' : '';
          const val = Number.isInteger(r.sum) ? r.sum : Math.round(r.sum * 10) / 10;
          return `<div class="st-row"><span class="st-label">${r.label}</span><span class="st-val">${sign}${val}${r.unit}</span></div>`;
        }).join('');
      return `<div class="st-cat">${cat}</div>${catRows}`;
    }).join('');
  };

  let html = '';
  if (pc.length) html += `<div class="st-section">PC</div>${groupedHtml(pc)}`;
  if (pet.length) html += `<div class="st-section">ペット</div>${groupedHtml(pet)}`;
  el.innerHTML = html;
}

// ===== 保存枠(localStorage、5枠、ブラウザで開き直しても残る) =====
const SLOT_COUNT = 5;
const SLOT_PREFIX = 'devotionPlannerSlot_';

function serializeState(){
  return {
    crossroads: { ...state.crossroads },
    crossroadExcluded: [...state.crossroadExcluded],
    selected: [...state.selected],
    targets: [...state.targets],
    excluded: [...state.excluded],
    partial: [...state.partial.entries()].map(([k, set]) => [k, [...set]]),
  };
}

function loadSnapshotIntoState(snap){
  resetState();
  state.crossroads = { ...snap.crossroads };
  state.crossroadExcluded = new Set(snap.crossroadExcluded || []);
  state.selected = new Set(snap.selected || []);
  state.targets = new Set(snap.targets || []);
  state.excluded = new Set(snap.excluded || []);
  state.partial = new Map((snap.partial || []).map(([k, arr]) => [k, new Set(arr)]));
}

function snapshotSummary(snap){
  const g = z();
  let cost = 0;
  AFF.forEach(a => { if (snap.crossroads[a]) { g[a] += 1; cost += 1; } });
  const names = [];
  (snap.selected || []).forEach(key => {
    const item = findItem(key);
    if (!item) return;
    const partialEntry = (snap.partial || []).find(([k]) => k === key);
    if (partialEntry) {
      cost += partialEntry[1].length;
      names.push(jaOnly(item[0]) + '(△)');
    } else {
      cost += item[1];
      AFF.forEach(a => { g[a] += (item[3][a] || 0); });
      names.push(jaOnly(item[0]));
    }
  });
  return { cost, granted: g, names };
}

function getSlot(i){
  try {
    const raw = localStorage.getItem(SLOT_PREFIX + i);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function setSlot(i, data){
  try { localStorage.setItem(SLOT_PREFIX + i, JSON.stringify(data)); } catch(e) {}
}
function clearSlot(i){
  try { localStorage.removeItem(SLOT_PREFIX + i); } catch(e) {}
}

function renderSlotBar(){
  const bar = document.getElementById('slotBar');
  bar.innerHTML = '';
  for (let i = 1; i <= SLOT_COUNT; i++) {
    const snap = getSlot(i);
    const card = document.createElement('div');
    card.className = 'slot-card' + (snap ? ' filled' : '');
    if (snap) {
      const sum = snapshotSummary(snap);
      const affStr = AFF.filter(a => sum.granted[a] > 0).map(a => `${AFF_LABEL[a]}${sum.granted[a]}`).join(' ');
      card.innerHTML = `
        <div class="slot-title">枠 ${i}</div>
        <div class="slot-summary">
          ${sum.cost}pt・${sum.names.length}星座<br>
          ${affStr || '(親和性なし)'}
        </div>
        <div class="slot-btns">
          <div class="slot-btn" data-act="load">読込</div>
          <div class="slot-btn" data-act="save">上書</div>
          <div class="slot-btn danger" data-act="clear">削除</div>
        </div>
      `;
    } else {
      card.innerHTML = `
        <div class="slot-title">枠 ${i}</div>
        <div class="slot-summary"><span class="empty">(空)</span></div>
        <div class="slot-btns">
          <div class="slot-btn" data-act="save" style="flex:1 1 100%;">現在の状態を保存</div>
        </div>
      `;
    }
    card.querySelectorAll('[data-act]').forEach(btn => {
      btn.onclick = () => {
        const act = btn.dataset.act;
        if (act === 'save') {
          setSlot(i, serializeState());
        } else if (act === 'load') {
          loadSnapshotIntoState(snap);
          document.getElementById('comparePanel').style.display = 'none';
        } else if (act === 'clear') {
          clearSlot(i);
        }
        renderAll();
      };
    });
    bar.appendChild(card);
  }
}

function renderComparePanel(){
  const panel = document.getElementById('comparePanel');
  const slots = [];
  for (let i = 1; i <= SLOT_COUNT; i++) {
    const snap = getSlot(i);
    if (snap) slots.push({ i, snap, sum: snapshotSummary(snap) });
  }
  if (slots.length === 0) {
    panel.innerHTML = '<div class="target-empty">保存済みの枠がありません。まず「保存」してください。</div>';
    return;
  }
  const rows = [
    { label: '祈祷ポイント', get: s => `${s.sum.cost} / ${CAP}` },
    ...AFF.map(a => ({ label: AFF_LABEL[a], get: s => s.sum.granted[a] || 0 })),
    { label: '取得星座', get: s => `<span class="names-inline">${s.sum.names.join('、') || '(なし)'}</span>` },
  ];
  let html = '<table class="compare-table"><thead><tr><th></th>';
  slots.forEach(s => { html += `<th>枠 ${s.i}</th>`; });
  html += '</tr></thead><tbody>';
  rows.forEach(row => {
    html += `<tr><th>${row.label}</th>`;
    slots.forEach(s => {
      const isNames = row.label === '取得星座';
      html += `<td class="${isNames ? 'names' : ''}">${row.get(s)}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  panel.innerHTML = html;
}

document.getElementById('compareBtn').onclick = () => {
  const panel = document.getElementById('comparePanel');
  const willOpen = panel.style.display === 'none';
  if (willOpen) renderComparePanel();
  panel.style.display = willOpen ? 'block' : 'none';
};

function runSolve(){
  state.mode = 'target';
  const result = solveSuggestions();
  renderAll();
  const resultEl = document.getElementById('suggestResult');
  if (!resultEl) return;
  if (goalKeys().size === 0) {
    resultEl.innerHTML = '<span class="target-empty">まず星座カードの〇か△で対象を指定してください。</span>';
  } else if (result.chosen.length === 0) {
    resultEl.innerHTML = '<span class="target-empty">既に必要親和性は満たされています。</span>';
  } else {
    const addedCost = result.chosen.reduce((s,c)=>s+c.cost,0);
    const lines = result.chosen.map(c => `<div><span class="item">${c.label}</span> <span class="cost">+${c.cost}pt</span></div>`).join('');
    resultEl.innerHTML = `
      <div style="margin-bottom:6px;color:var(--text);">リセット状態からの最小レシピ(合計${addedCost}pt、Tier1/2と岐路から選出):</div>
      ${lines}
      ${!result.solved ? '<div style="color:#ff9aa3;margin-top:6px;">⚠ Tier1/2だけでは全ては埋まりません。他の星座からの供給が必要です。</div>' : ''}
      <div style="margin-top:8px;color:var(--text-dim);font-size:10.5px;">※現在の選択状態を基準に、目標達成に不足する分の最小レシピを計算し、そのまま実際の選択(祈祷ポイント合計)にも反映しています。</div>
    `;
  }
}

function showTooltip(cardEl, desc){
  const tooltip = document.getElementById('sharedTooltip');
  const body = document.getElementById('sharedTooltipBody');
  body.textContent = (desc || '(効果情報なし)').replace(/([、,])?\s*ペットボーナス/g, '\n　→ペットボーナス');
  body.style.whiteSpace = 'pre-line';

  tooltip.classList.add('show');
  // 一旦表示してサイズを測る
  const tw = Math.min(320, tooltip.offsetWidth || 280);
  const th = tooltip.offsetHeight || 200;
  const rect = cardEl.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;

  let left = rect.left + rect.width / 2 - tw / 2;
  left = Math.max(8, Math.min(left, vw - tw - 8));

  let top;
  const spaceBelow = vh - rect.bottom;
  const spaceAbove = rect.top;
  if (spaceBelow >= th + 12 || spaceBelow >= spaceAbove) {
    top = Math.min(rect.bottom + 10, vh - th - 8);
  } else {
    top = Math.max(8, rect.top - th - 10);
  }

  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}
function hideTooltip(){
  document.getElementById('sharedTooltip').classList.remove('show');
}
// スマホ:タップ後にツールチップが張り付いたままになるのを防ぐ
document.addEventListener('touchstart', (e) => {
  if (!e.target.closest('.star-card')) hideTooltip();
}, { passive: true });
document.addEventListener('touchend', (e) => {
  if (!e.target.closest('.star-card')) hideTooltip();
}, { passive: true });
window.addEventListener('scroll', hideTooltip, { passive: true, capture: true });

function renderAll(){  const granted = grantedTotals();
  renderAffinityRow(granted);
  renderCrossroads();

  document.getElementById('targetPanel').style.display = state.mode === 'target' ? 'block' : 'none';
  document.getElementById('tabManual').classList.toggle('active', state.mode === 'manual');
  document.getElementById('tabTarget').classList.toggle('active', state.mode === 'target');
  if (state.mode === 'target') renderTargetPanel();

  const tiersDiv = document.getElementById('tiers');
  tiersDiv.innerHTML = '';
  tiersDiv.appendChild(renderTier('Tier 1', TIER1, 't1', granted));
  tiersDiv.appendChild(renderTier('Tier 2', TIER2, 't2', granted));
  tiersDiv.appendChild(renderTier('Tier 3', TIER3, 't3', granted));

  const cost = totalCost();
  const pct = Math.min(100, (cost / CAP) * 100);
  const fill = document.getElementById('budgetFill');
  const num = document.getElementById('budgetNum');
  fill.style.width = pct + '%';
  num.textContent = `${cost} / ${CAP}`;
  if (cost > CAP) { fill.classList.add('over'); num.classList.add('over'); }
  else { fill.classList.remove('over'); num.classList.remove('over'); }

  renderSummaryTooltip();
  renderSlotBar();
}

document.getElementById('tabManual').onclick = () => { state.mode = 'manual'; renderAll(); };
document.getElementById('tabTarget').onclick = () => { state.mode = 'target'; renderAll(); };
document.getElementById('resetBtn').onclick = () => { resetState(); renderAll(); };
document.getElementById('quickCalcBtn').onclick = () => { runSolve(); };
document.getElementById('summaryBtn').onclick = (e) => {
  e.stopPropagation();
  document.getElementById('summaryTooltip').classList.toggle('open');
};
document.addEventListener('click', (e) => {
  if (!e.target.closest('.summary-btn-wrap')) {
    document.getElementById('summaryTooltip').classList.remove('open');
  }
});
document.getElementById('solveBtn').onclick = () => { runSolve(); };

renderAll();
</script>
